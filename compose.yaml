# Komodo stack `acroscope` (homelab). Builds this repo; the container mounts the Google Drive "FPV drone" folder
# at /data with rclone and serves the player on :8070. The rclone config (OAuth token for the `gdrive` remote,
# root_folder_id pinned to the folder) is a host file outside the stack dir, never in git or in the stack env.
services:
  acroscope:
    build: .
    image: acroscope:local
    container_name: acroscope
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      RCLONE_CONFIG: /config/rclone.conf
      GDRIVE_CACHE_SIZE: ${GDRIVE_CACHE_SIZE:-6G}
    volumes:
      - /opt/acroscope/rclone:/config          # rclone.conf (0600); writable so refreshed tokens persist
      - /opt/acroscope/cache:/cache            # decoded arms, frames, H.264 proxies, rclone VFS cache
      - /opt/acroscope/state:/state            # the database (matches, moments, notes): the one thing to back up
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
