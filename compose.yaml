# Komodo stack `acroscope` (homelab). Builds this repo; the container serves the player and the API on :8070 over
# CT 109's bind mount of the Data/fpv dataset (clips, logs, inbox, originals, state): szrudi/homelab#102.
services:
  acroscope:
    build: .
    image: acroscope:local
    container_name: acroscope
    restart: unless-stopped
    # runs as root: Data/fpv is owned by CT 109's root (host uid 100000); inbox/ belongs to the push user fpvpush
    ports:
      - "8070:8070"
    volumes:
      - /data:/data                            # CT 109's mp0 of Data/fpv: videos/, blackbox/, inbox/, originals/, state/
      - /opt/acroscope/cache:/cache            # decoded arms, frames, OSD readings, H.264 proxies: disposable
      - /opt/acroscope/state:/state            # the database (matches, moments, notes): backed up nightly into /data/state too
