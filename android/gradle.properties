# Kept small on purpose: the first runs with a 2 GB daemon, a separate Kotlin daemon and a test JVM beside them drove
# an 8 GB machine that does other things into swap. The Kotlin compiler runs inside Gradle's own process, two workers
# at most. A machine with room to spare may raise these in ~/.gradle/gradle.properties.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
