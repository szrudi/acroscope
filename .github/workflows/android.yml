# The companion app (#75): its tests and a debug APK, whenever the app or the server's side of its protocol changes.
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "acroscope/ingest/drop.py", "acroscope/server/drop.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "acroscope/ingest/drop.py", "acroscope/server/drop.py", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the client is tested against a real `acroscope serve`; orangebox's wheel exits 1 after installing (see the Dockerfile)
      - run: pip install orangebox==0.5.0 || true; python -c "import orangebox"
      - uses: gradle/actions/setup-gradle@v4
      - name: tests and a debug build
        working-directory: android
        env:
          ACROSCOPE_PYTHON: python
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
      # the client's tests against the server skip where there is no Python: here there is one, so none may
      - name: no test was skipped
        run: "! grep -l 'skipped=\"[1-9]' android/core/build/test-results/test/*.xml android/app/build/test-results/testDebugUnitTest/*.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: acroscope-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
