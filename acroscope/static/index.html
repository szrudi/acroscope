<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>acroscope</title>
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="/static/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<style>
  :root { --bg:#14161a; --panel:#1c1f25; --line:#2b3039; --fg:#e6e8ec; --dim:#9aa3b2; --acc:#f5a524; --acc2:#4cc2ff; --bad:#ff6b6b; --ok:#5fd68b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; height:100vh; height:100dvh; display:grid; grid-template-rows:44px 1fr; grid-template-columns:minmax(0, 1fr); }   /* the column is the window: an auto one grew to the header's whole content (a long status line) and pushed the right side off screen */
  header { display:flex; align-items:center; gap:14px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel) }
  header h1 { font-size:16px; margin:0; color:var(--acc); letter-spacing:.5px; white-space:nowrap; flex:none }
  header select { background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:4px 8px; border-radius:6px; font-size:14px }
  header .keys { margin-left:auto; color:var(--dim); font-size:11px; white-space:nowrap; flex:none } header .keys kbd { font-size:11px; padding:0 4px }
  header #status { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }   /* one line, never wraps the header */
  .snote { color:var(--dim); font-size:13px; white-space:pre-wrap }
  kbd { background:#2a2f38; border:1px solid #3a404b; border-radius:4px; padding:0 5px; font:12px ui-monospace, monospace }
  main { display:grid; grid-template-columns:260px 1fr 360px; min-height:0 }
  aside, section { min-height:0; overflow:auto }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column }
  aside .tabs { display:flex; border-bottom:1px solid var(--line); flex:none }
  aside .tab { flex:1; text-align:center; padding:7px 0; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); cursor:pointer; user-select:none }
  aside .tab.on { color:var(--fg); border-bottom:2px solid var(--acc) }
  aside .pane-body { overflow:auto; min-height:0; flex:1 }
  .log { padding:8px 12px 4px; border-bottom:1px solid var(--line) }
  .log .f { font-weight:600; font-size:12px } .log .cov { color:var(--dim); font-size:12px }
  .log .cov b { color:var(--acc2); font-weight:500 } .log .cov .miss { color:var(--bad) }
  .logbar { padding:8px 12px; border-bottom:1px solid var(--line) } .log .f .flag { color:var(--bad); font-weight:400 }
  .log .f { display:flex; align-items:center; gap:4px } .log .f .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .boot { padding:6px 12px 2px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px }
  .arm { padding:3px 12px 3px 18px; display:grid; grid-template-columns:52px 46px 1fr; gap:0 8px; font-size:12px; font-variant-numeric:tabular-nums; cursor:default }
  .arm.has { cursor:pointer } .arm.has:hover { background:#232832 }
  .arm .n { color:var(--fg) } .arm .l { color:var(--dim) } .arm .c b { color:var(--acc2); font-weight:500 } .arm .c .no { color:var(--bad) }
  .arm .c .flag { color:var(--dim) }
  .batch { padding:8px 12px; border-bottom:1px solid var(--line); font-size:12px }
  .batch .id { font-weight:600 } .batch .st { color:var(--dim) } .batch .st.failed { color:var(--bad) } .batch .st.done { color:var(--ok) }
  .batch .err { color:var(--bad); white-space:pre-wrap } .batch .pg { height:4px; background:#0f1115; border-radius:2px; margin-top:4px } .batch .pg i { display:block; height:4px; background:var(--acc2); border-radius:2px }
  .clip .mv { float:right; opacity:0; font-size:11px } .clip .mv + .mv { margin-right:4px } .clip:hover .mv { opacity:.8 }
  header button.small { padding:2px 6px }
  .right { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden }
  .clip { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:2px 8px }
  .clip:hover { background:#232832 } .clip.on { background:#2a3140; border-left:3px solid var(--acc) }
  .clip .n { font-weight:600 } .clip .d { color:var(--dim); font-variant-numeric:tabular-nums }
  .clip .arms { grid-column:1/3; color:var(--dim); font-size:12px } .clip .arms b { color:var(--acc2); font-weight:500 }
  .clip .warn { color:var(--bad) } .clip .cnt { color:var(--acc) }
  .clip.gone { opacity:.55 } .clip.gone .n { text-decoration:line-through }
  .center { display:flex; flex-direction:column; padding:10px 14px; gap:8px }
  video { width:100%; max-height:62vh; background:#000; border-radius:6px; outline:none; display:block }
  .vwrap { position:relative } #sticks { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
  /* the phone: a faint arrow in the gutter beside the video where a swipe leads to another clip (no room added) */
  .swipe-hint { display:none; position:absolute; top:50%; transform:translateY(-50%); width:8px; text-align:center; font:normal 12px/1 system-ui, sans-serif; color:var(--dim); opacity:.55; pointer-events:none }
  .swipe-hint[data-side=prev] { right:100% } .swipe-hint[data-side=next] { left:100% }
  body.phone .vwrap.has-prev .swipe-hint[data-side=prev], body.phone .vwrap.has-next .swipe-hint[data-side=next] { display:block }
  #strip { width:100%; height:54px; display:block; cursor:pointer; border-radius:4px; background:#0f1115 }
  .readout { display:flex; gap:18px; color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; min-height:20px }
  body.phone .readout:empty { display:none }   /* until the video reports a time: no empty row (and its gaps) under the controls; the desktop keeps the row so nothing jumps */
  .readout b { color:var(--fg); font-weight:500 }
  .rorow { display:flex; gap:8px; align-items:flex-start } .rorow .readout { flex:1 }
  #sticksTog.on { background:var(--acc); color:#1a1200; border-color:var(--acc) }
  body.phone #sticksTog { display:none } body.phone .rorow:has(.readout:empty) { display:none }   /* the phone has its button in the controls */
  .editor { display:none; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel); gap:8px; flex-direction:column }
  .editor.open { display:flex }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  input, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit }
  input.t { width:80px; font-variant-numeric:tabular-nums } input.title { flex:1; min-width:200px } textarea { width:100%; min-height:54px; resize:vertical }
  button { background:#2a2f38; color:var(--fg); border:1px solid #3a404b; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit }
  button:hover { background:#343a46 } button.primary { background:var(--acc); color:#1a1200; border-color:var(--acc); font-weight:600 }
  button.small { padding:2px 7px; font-size:12px }
  button:disabled, button:disabled:hover { opacity:.45; cursor:default; background:#2a2f38 }
  a.btn { background:#2a2f38; color:var(--fg); border:1px solid #3a404b; border-radius:6px; padding:2px 7px; font-size:12px; line-height:1.4; text-decoration:none } a.btn:hover { background:#343a46 }   /* a link that looks like button.small (a download needs a link) */
  .chip { display:inline-block; padding:2px 9px; border-radius:12px; border:1px solid var(--c, var(--line)); cursor:pointer; font-size:12px; user-select:none }
  .chip.on { background:var(--c, var(--acc2)); color:#111; border-color:var(--c, var(--acc2)) }
  .chip .n { opacity:.7; margin-left:4px; font-size:11px }
  .tag { display:inline-block; padding:0 7px; border-radius:10px; font-size:11px; background:#2f3542; color:var(--c, var(--acc2)); margin-right:3px }
  .tagbar { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; min-height:22px }
  .cat { color:var(--dim); text-transform:uppercase; letter-spacing:.5px; font-size:11px; margin-left:10px; cursor:pointer; user-select:none }
  .cat:first-child { margin-left:0 } .cat.on { color:var(--fg) }
  .tagbar .mgr { margin-left:auto }
  #tagmgr .row { gap:6px } #tagmgr input[type=color] { width:28px; height:24px; padding:0; border:0; background:none; cursor:pointer }
  #tagmgr select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit }
  .right h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0; padding:10px 12px 6px; display:flex; align-items:center; gap:8px }
  .right h2 label { font-weight:400; text-transform:none; letter-spacing:0; margin-left:auto; cursor:pointer }
  /* each pane takes its content height, shrinks (and scrolls) when the two together overflow, never grows into a gap */
  .pane { display:flex; flex-direction:column; flex:0 1 auto; min-height:0; overflow:hidden }
  .pane + .pane { border-top:1px solid var(--line) }
  .pane h2 { flex:none; cursor:pointer; user-select:none } .pane h2::before { content:'\25BE'; width:10px; color:var(--dim) }
  .pane.closed { flex:none } .pane.closed .list { display:none } .pane.closed h2::before { content:'\25B8' }
  .list { flex:1 1 auto; min-height:0; overflow:auto }
  .m { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:52px 1fr auto; gap:2px 8px; align-items:start }
  .m:hover { background:#232832 } .m.on { background:#2a3140; border-left:3px solid var(--acc) }
  .m img { width:52px; height:35px; object-fit:cover; border-radius:3px; background:#000; grid-row:1/3 }
  .m .t { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums }
  .m .ttl { font-weight:500 } .m .note { grid-column:2/4; color:var(--dim); font-size:12px; white-space:pre-wrap; display:none } .m.on .note { display:block }
  .m .act { display:flex; gap:4px; grid-row:1/3; align-self:center }
  .empty { padding:12px; color:var(--dim) }
  .why { grid-column:2/4; color:var(--dim); font-size:12px }
  body.phone header .keys { display:none }   /* phones have no keys; on the desktop fitKeys() shows them where they fit */
  /* on-screen controls (phones have no keys) and the phone tab bar: hidden on the desktop layout */
  .mctl, .mtabs { display:none }
  .mctl { gap:6px; justify-content:space-between } .mctl button { flex:1; padding:9px 0; font-size:14px }
  .mctl button.on { background:var(--acc); color:#1a1200; border-color:var(--acc) }
  .mtabs { border-top:1px solid var(--line); background:var(--panel); flex:none }
  .mtabs span { flex:1; text-align:center; padding:10px 0; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); cursor:pointer; user-select:none }
  .mtabs span.on { color:var(--fg); box-shadow:inset 0 -2px 0 var(--acc) }
  #ptr { position:fixed; left:0; right:0; top:0; z-index:6; text-align:center; pointer-events:none; color:var(--dim); font-size:12px; padding:6px 0; background:var(--panel); border-bottom:1px solid var(--line); transform:translateY(-100%); transition:transform .15s }
  #ptr.on { transform:none } #ptr.go { color:var(--acc) }
  #askbox { display:none; position:fixed; left:0; right:0; bottom:0; padding:12px; background:var(--panel); border-top:1px solid var(--line); z-index:5; gap:8px; flex-wrap:wrap; align-items:center }
  #askbox.open { display:flex } #askbox input { flex:1; min-width:160px; font-size:16px } #askbox .l { width:100%; color:var(--dim); font-size:12px }
  /* phone: the video pinned at the top, one pane at a time under a tab bar; set by JS on the viewport, not just width */
  body.phone { overflow:hidden; width:100vw; max-width:100vw; position:fixed; inset:0; height:auto }   /* the page never scrolls; the panes do. inset:0 alone sizes it to what is visible (the browser's bar, the installed app's system bars); 100dvh ran under the installed app's navigation bar and hid the tab bar */
  body.phone.hide-head header { display:none }   /* scrolled down in a pane: the header goes; scrolling up brings it back */
  body.phone .mtabs { padding-bottom:env(safe-area-inset-bottom) }
  body.phone main { display:flex; flex-direction:column; min-height:0; min-width:0; max-width:100vw; overflow-x:hidden; grid-row:2 }   /* row 2 also with the header hidden: in row 1 (auto) a short pane left the tab bar mid-screen */
  body.phone .mtabs { margin-top:auto }   /* the tab bar at the bottom however little the pane holds */
  body.phone main > *, body.phone .center > * { min-width:0; max-width:100% }
  body.phone #strip { width:100% }
  body.phone .center { flex:none; padding:6px 8px; gap:6px; overflow:visible; order:0 } body.phone video { max-height:38vh }
  body.phone aside, body.phone .right { order:1 } body.phone .mtabs { order:2 }   /* video, then the pane, then the tabs, whatever the markup order */
  body.phone .mctl { display:flex } body.phone .mtabs { display:flex }
  body.phone aside, body.phone .right { display:none; border:0; flex:1; min-height:0; overflow:hidden }
  body.phone aside .tabs, body.phone .right h2 { display:none }
  body.phone #paneMoments h2 { display:flex; padding:4px 12px; cursor:default } body.phone #paneMoments h2::before { display:none }   /* the phone keeps the 'all clips' switch (the tab bar names the pane) */
  body.phone[data-tab=clips] aside, body.phone[data-tab=logs] aside, body.phone[data-tab=inbox] aside { display:flex }
  body.phone[data-tab=moments] .right, body.phone[data-tab=sugg] .right { display:flex }
  body.phone .pane { display:none } body.phone[data-tab=moments] #paneMoments, body.phone[data-tab=sugg] #paneSugg { display:flex; flex:1 }
  body.phone .pane .list { display:block }
  body.phone { grid-template-rows:auto 1fr }   /* the header may wrap; the viewport unit above keeps the tab bar on screen under the browser's bar */
  body.phone header { height:auto; min-height:44px; flex-wrap:wrap; padding:6px 10px; gap:8px } body.phone header select { flex:1; min-width:0; font-size:16px }
  body.phone .tagbar .mgr { margin-left:0 } body.phone .tagbar .cat { margin-left:4px }   /* no push to the right edge: in a wrapping row that is a row of its own */
  body.phone video { max-height:34vh }
  body.phone header #status { width:100%; font-size:12px } body.phone .readout { font-size:12px; gap:10px; flex-wrap:wrap }
  body.phone .snote { display:none } body.phone #editor { position:fixed; left:0; right:0; bottom:46px; max-height:60vh; overflow:auto; z-index:4; border-radius:8px 8px 0 0 }
  @media (pointer: coarse) {
    .clip { padding:12px 14px } .m { padding:10px 12px } .arm { padding:7px 12px 7px 18px; font-size:13px }
    button.small, a.btn { padding:6px 10px; font-size:13px } .chip { padding:6px 12px; font-size:13px } .tagbar { gap:6px 8px }
    input, textarea, select { font-size:16px }   /* 16 px: iOS does not zoom in on focus */
    .clip .mv { opacity:.8 }
  }
</style>
</head>
<body>
<div id="ptr">↓ pull to refresh</div>
<header>
  <h1><img src="/static/brand/icon.svg" alt="" style="height:22px;vertical-align:-5px;margin-right:6px" onerror="this.remove()">acroscope</h1>
  <select id="session"></select>
  <button class="small" id="renameSession" title="rename this session (YYYY-MM-DD-name; the date is the first ten characters), or merge it into another by giving that one's name">✎</button>
  <span id="status" style="color:var(--dim)"></span>
  <span class="keys"><kbd>space</kbd> play <kbd>←</kbd><kbd>→</kbd> 2 s <kbd>,</kbd><kbd>.</kbd> frame <kbd>i</kbd><kbd>o</kbd> in/out <kbd>t</kbd> tag <kbd>n</kbd><kbd>p</kbd> next/prev <kbd>l</kbd> loop</span>
</header>
<main>
  <aside>
    <div class="tabs"><span class="tab on" data-tab="clips">clips</span><span class="tab" data-tab="logs">logs</span><span class="tab" data-tab="inbox">inbox <span id="inboxCount"></span></span></div>
    <div class="pane-body" id="clips"></div>
    <div class="pane-body" id="logs" style="display:none"></div>
    <div class="pane-body" id="inbox" style="display:none"></div>
  </aside>
  <section class="center">
    <div class="vwrap"><video id="v" controls preload="metadata"></video><canvas id="sticks"></canvas><i class="swipe-hint" data-side="prev">‹</i><i class="swipe-hint" data-side="next">›</i></div>
    <canvas id="strip" height="54"></canvas>
    <div class="tagbar" id="tagbar"></div>
    <div class="mctl">
      <button data-act="prev" title="previous moment">◀◀</button><button data-act="in" title="set the in point here">in</button>
      <button data-act="out" title="set the out point here">out</button><button data-act="tag" title="tag from in to out">tag</button>
      <button data-act="next" title="next moment">▶▶</button><button data-act="loop" id="loopBtn" title="loop the current moment">loop</button>
      <button data-act="sticks" id="sticksBtn" title="the sticks from the log over the picture">sticks</button>
    </div>
    <div class="rorow"><div class="readout" id="readout"></div><button class="small" id="sticksTog" title="the sticks from the log over the picture (s)">sticks</button></div>
    <div class="snote" id="snote"></div>
    <div class="editor" id="editor">
      <div class="row">
        <span id="edId" style="color:var(--dim);min-width:40px"></span>
        in <input class="t" id="edIn"> <button class="small" onclick="setIn()">now</button>
        out <input class="t" id="edOut"> <button class="small" onclick="setOut()">now</button>
        <input class="title" id="edTitle" placeholder="title">
      </div>
      <div class="row" id="edTags"></div>
      <textarea id="edNote" placeholder="note"></textarea>
      <div class="row"><button class="primary" onclick="saveMoment()">save</button><button onclick="closeEditor()">cancel</button>
        <span id="edWhy" style="color:var(--dim);font-size:12px"></span></div>
    </div>
    <div class="editor" id="tagmgr"></div>
  </section>
  <div class="right">
    <div class="pane" id="paneMoments">
      <h2>moments <span id="mcount"></span><label><input type="checkbox" id="allClips"> all clips</label></h2>
      <div class="list" id="moments"></div>
    </div>
    <div class="pane" id="paneSugg">
      <h2>suggested (untagged) <span id="scount"></span></h2>
      <div class="list" id="sugg"></div>
    </div>
  </div>
  <div class="mtabs" id="mtabs"><span data-mtab="clips">clips</span><span data-mtab="moments">moments</span><span data-mtab="sugg">suggested</span><span data-mtab="logs">logs</span><span data-mtab="inbox">inbox</span></div>
</main>
<div id="askbox"><span class="l" id="askLabel"></span><input id="askInput"><button class="primary" id="askOk">ok</button><button id="askCancel">cancel</button></div>
<script>
const $ = s => document.querySelector(s);
const v = $('#v'), strip = $('#strip'), ctx = strip.getContext('2d');
let S = null, clip = null, series = [], sugg = [], suggErr = '', TAGS = {categories: [], tags: []}, cur = null, loopM = null, armLen = {};
let filter = new Set();   // tags selected in the bar under the strip; empty = everything. The list and the markers follow it.
const tagDef = t => TAGS.tags.find(x => x.name === t);
const catDef = c => TAGS.categories.find(x => x.name === c);
const tagColor = t => tagDef(t)?.color || catDef(tagDef(t)?.category)?.color || '#9aa3b2';
const passes = m => !filter.size || (m.tags || []).some(t => filter.has(t));
const pill = t => `<span class="tag" style="--c:${esc(tagColor(t))}">${esc(t)}</span>`;
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); return m + ':' + (t - m * 60).toFixed(1).padStart(4, '0'); };
const parse = s => { s = String(s).trim(); if (s.includes(':')) { const [m, x] = s.split(':'); return +m * 60 + +x; } return +s; };
const api = (p, o) => fetch(p, o).then(r => r.json());
const asList = x => Array.isArray(x) ? x : [];   // a list endpoint that answered {error} (a log that will not decode): nothing to show
// a clip's readable name ("2026-10-07_007") and its short form ("007"); the file name on disk is its id
const clipName = f => (S && S.videos.find(x => x.file === f)?.name) || f.replace(/\.[^.]+$/, '');
const clipNum = f => { const n = clipName(f); const m = n.match(/_(\d{3})$/); return m ? m[1] : n; };
const canHevc = v.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"') || v.canPlayType('video/mp4; codecs="hev1.1.6.L93.B0"');

async function init() {
  $('#status').textContent = 'loading sessions…';
  TAGS = await api('/api/tags');
  const list = await api('/api/sessions');
  const sel = $('#session');
  if (!list.length) { $('#status').textContent = 'no sessions yet: drop a batch into inbox/ or a folder into videos/'; setTimeout(init, 10000); return; }
  sel.innerHTML = list.slice().reverse().map(s => `<option value="${esc(s.session)}">${esc(s.session)} · ${s.videos} clips · ${s.moments} moments</option>`).join('');
  sel.onchange = () => loadSession(sel.value);
  // the URL wins over what was open last time: ?session=…&clip=007&m=m13&t=80.5 is a link to a spot
  const q = new URLSearchParams(location.search);
  if (q.get('tags')) filter = new Set(q.get('tags').split(',').filter(Boolean));
  const want = q.get('session') || localStorage.getItem('acro.session');
  sel.value = list.some(s => s.session === want) ? want : (list.filter(s => s.moments).pop() || list[list.length - 1]).session;
  await loadSession(sel.value, q.get('clip') || localStorage.getItem('acro.clip'));
  if (q.get('m') && S.moments.some(m => m.id === q.get('m'))) playMoment(q.get('m'));
  else if (q.get('t') && clip) { v.currentTime = +q.get('t'); setUrl(); }
}

// keep the address bar a link to what is on screen (no history entries: back/forward stay the browser's)
function setUrl() {
  if (!S) return;
  const q = new URLSearchParams({session: S.session});
  if (clip) q.set('clip', clipNum(clip));
  if (cur) q.set('m', cur);

}
function momentLink(id) { const m = S.moments.find(x => x.id === id); return `${location.origin}/?${new URLSearchParams({session: S.session, clip: clipNum(m.video), m: id})}`; }

async function loadSession(name, wantClip) {

async function refreshSession() {

// a clip that is not worth keeping (a no-signal recording): the server moves the file into trash/<date>/ for 7 days

async function deleteClip(file) {
  const n = S.moments.filter(m => m.video === file).length, a = S.matches.filter(m => m.video === file).length;

const logShort = b => b.length > 40 ? b.slice(25, 40) : b;
function logHead(b) {

  return `<div class="f" title="${esc(b)}"><span class="nm">${esc(logShort(b))}</span>` +

    `<button class="small" data-lmv="${esc(b)}" title="move this log to another session">⇄</button>` +

}
function renderLogs() {
  const arms = S.arms || [], boots = S.boots || {};
  let h = `<div class="logbar"><button class="small" id="logsAutomatch" ${automatching === S.session ? 'disabled' : ''} title="match the clips without a match to the session's logs from the OSD timers; clips with a match, by hand or not, are left alone">🎯 automatch the clips without a match</button></div>`;
  for (const b of S.blackbox || []) {
    const rows = arms.filter(a => a.bbl === b);
    if ((S.arms_pending || []).includes(b)) { h += `<div class="log">${logHead(b)}<div class="cov">decoding in the background…</div></div>`; continue; }
    if (!rows.length) { h += `<div class="log">${logHead(b)}<div class="cov">no arms</div></div>`; continue; }
    const flown = rows.filter(a => a.motors_spun !== false), covered = flown.filter(a => a.videos.length);
    const secs = xs => xs.reduce((t, a) => t + (a.length || 0), 0);
    h += `<div class="log">${logHead(b)}<div class="cov">${rows.length} arms · <b>${covered.length}</b> with a clip` +
      (flown.length - covered.length ? ` · <span class="miss">${flown.length - covered.length} without</span> (${fmt(secs(flown) - secs(covered))} of flight)` : '') + `</div></div>`;
    const groups = (boots[b] && boots[b].length) ? boots[b] : [{first: rows[0].index, last: rows[rows.length - 1].index, arms: rows.map(a => a.index)}];
    for (const g of groups) {
      if (groups.length > 1) h += `<div class="boot">boot: arms ${g.first}–${g.last}</div>`;
      for (const a of rows.filter(a => g.arms.includes(a.index))) {
        const v = a.videos[0];
        const flags = (a.motors_spun === false ? ' <span class="flag">motors off</span>' : '') + (a.complete === false ? ' <span class="flag">cut off</span>' : '');
        const c = v ? `<b>${esc(clipNum(v.video))}</b> +${v.offset}s` + (a.videos.length > 1 ? ` +${a.videos.length - 1}` : '') : (a.motors_spun === false ? '<span class="flag">no clip</span>' : '<span class="no">no clip</span>');
        h += `<div class="arm ${v ? 'has' : ''}" ${v ? `data-v="${esc(v.video)}" data-t="${v.offset}"` : ''}><span class="n">arm ${a.index}</span><span class="l">${fmt(a.length)}</span><span class="c">${c}${flags}</span></div>`;
      }
    }
  }
  $('#logs').innerHTML = (S.blackbox || []).length ? h : '<div class="empty">no blackbox file in this session</div>';   // and no automatch
  $('#logs').querySelectorAll('.arm.has').forEach(el => el.onclick = async () => {
    const t = Math.max(0, +el.dataset.t - 1.0);   // a second before the arm, so the ARMED moment is on screen

  if ($('#logsAutomatch')) $('#logsAutomatch').onclick = automatchSession;
  $('#logs').querySelectorAll('[data-lmv]').forEach(el => el.onclick = () => moveLog(el.dataset.lmv));

}
// automatch on the server as a job (a session's worth of OSD reading takes minutes): only the clips without a match,
// so matches placed by hand stay as they are; then the session again, with the new matches and their suggestions
let automatching = null;   // the session whose job runs (one at a time from this page; the server runs one per command)
async function automatchSession() {
  if (automatching) return;
  const name = automatching = S.session; renderLogs();
  const say = msg => { if (S.session !== name) return; $('#status').textContent = msg; setTimeout(() => { if ($('#status').textContent === msg) $('#status').textContent = ''; }, 8000); };
  try {
    $('#status').textContent = 'automatch: reading the OSD of the clips without a match…';
    const {job, error} = await api('/api/cli', {method: 'POST', body: JSON.stringify({args: ['automatch', name, '--unmatched', '--write'], async: true})});
    if (error) throw new Error(error);
    let r;
    for (;;) {
      r = await api('/api/cli/' + job);
      if (r.error) throw new Error(r.error);
      if (r.done) break;
      if (S.session === name) $('#status').textContent = `automatch: reading the OSD of the clips without a match… ${r.seconds} s`;
      await new Promise(res => setTimeout(res, 3000));
    }
    const got = [...(r.stdout || '').matchAll(/(\d+) matched/g)].reduce((t, m) => t + +m[1], 0);
    const clips = (r.stdout || '').split('\n').filter(l => / matched/.test(l)).length;
    const msg = r.code ? `automatch failed: ${(r.stderr || '').trim().split('\n').pop()}`
      : clips ? `automatch: ${got} matched over ${clips} clip${clips === 1 ? '' : 's'}` : `automatch: ${(r.stderr || 'nothing to do').trim().split('\n').pop()}`;
    if (S.session === name) await refreshSession();
    say(msg);
  } catch (e) {
    say(`automatch: ${e.message}`);
  } finally { automatching = null; if (S) renderLogs(); }
}
function logMatchNote(b) {
  const n = S.matches.filter(m => m.bbl === b).length;
  return n ? `\n\nIts ${n} match${n === 1 ? '' : 'es'} to clips here ${n === 1 ? 'is' : 'are'} deleted.` : '';
}
// while automatch runs, a log taken out could get matches written to it (and come back): wait for it
const busy = () => automatching === S.session && (alert('automatch is running on this session: wait for it to finish'), true);
async function moveLog(b) {
  if (busy()) return;
  const others = [...$('#session').options].map(o => o.value).filter(n => n !== S.session);
  const to = await ask(`move ${logShort(b)} to session (${others.slice(0, 6).join(', ')}${others.length > 6 ? ', …' : ''})`, S.session);
  if (!to || to === S.session) return;
  const note = logMatchNote(b);
  if (note && !confirm(`Move ${logShort(b)} to ${to}?${note}`)) return;
  const r = await api(`/api/session/${encodeURIComponent(S.session)}/move-log`, {method: 'POST', body: JSON.stringify({bbl: b, to})});
  if (r.error) { alert(r.error); return; }
  await refreshSession();
  flash(`${logShort(b)} moved to ${to}`);
}
async function removeLog(b) {
  if (busy()) return;
  if (!confirm(`Take ${logShort(b)} out of ${S.session}?${logMatchNote(b)}\n\nThe file stays in blackbox/ on the server.`)) return;
  const r = await api(`/api/session/${encodeURIComponent(S.session)}/blackbox`, {method: 'POST', body: JSON.stringify({remove: [b]})});
  if (r.error) { alert(r.error); return; }
  await refreshSession();
  flash(`${logShort(b)} taken out of ${S.session}`);
}

  const groups = TAGS.categories.map(c => [c.name, TAGS.tags.filter(t => t.category === c.name && use[t.name]).map(t => t.name)]);
  const loose = Object.keys(use).filter(t => !tagDef(t)).sort();
  if (loose.length) groups.push(['other', loose]);

    const dy = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    const sc = scroller(e.target);
    if (dy < 0 || dx > Math.max(dy, 10) || (sc && sc.scrollTop > 0)) return reset();   // up, sideways or scrolling: not a pull
    if (dy < 10) return;
    ptr.classList.add('on');
    go = dy >= PTR_FRAC * innerHeight;
    ptr.classList.toggle('go', go);
    ptr.textContent = go ? '↻ release to refresh' : '↓ pull to refresh';
  }, {passive: true});
  const end = () => { if (go) { ptr.textContent = 'refreshing…'; v.pause(); setUrl(); location.reload(); } else reset(); };
  document.addEventListener('touchend', end, {passive: true});
  document.addEventListener('touchcancel', reset, {passive: true});
}

// ---- a question at the bottom of the screen instead of prompt(): resolves to the text, or null
function ask(label, value) {
  return new Promise(res => {
    const box = $('#askbox'), inp = $('#askInput');
    $('#askLabel').textContent = label; inp.value = value || ''; box.classList.add('open'); inp.focus(); inp.select();
    const done = v => { box.classList.remove('open'); $('#askOk').onclick = $('#askCancel').onclick = inp.onkeydown = null; res(v); };
    $('#askOk').onclick = () => done(inp.value.trim());
    $('#askCancel').onclick = () => done(null);
    inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value.trim()); if (e.key === 'Escape') done(null); e.stopPropagation(); };
  });
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) { if (e.key === 'Escape') { e.target.blur(); } if (e.key === 'Enter' && e.target.id === 'edTitle') saveMoment(); return; }
  const k = e.key; let h = true;
  if (k === ' ') v.paused ? v.play() : v.pause();
  else if (k === 'ArrowLeft') v.currentTime -= e.shiftKey ? 10 : 2;
  else if (k === 'ArrowRight') v.currentTime += e.shiftKey ? 10 : 2;
  else if (k === ',') { v.pause(); v.currentTime -= 1 / 60; }
  else if (k === '.') { v.pause(); v.currentTime += 1 / 60; }
  else if (k === 'i') markIn();
  else if (k === 'o') markOut();
  else if (k === 't') tagNow();
  else if (k === 'n') step(1); else if (k === 'p') step(-1);
  else if (k === 'l') toggleLoop();
  else if (k === 's') toggleSticks();
  else if (k === 'Escape') closeEditor();
  else h = false;
  if (h) { e.preventDefault(); e.stopPropagation(); }
}, true);   // capture phase: the focused <video controls> would otherwise handle space/arrows too and undo ours
function flash(s) {   // for a moment, then what the status said before (a reload's "decoding blackbox in the background…")
  const before = $('#status').textContent;
  $('#status').textContent = s; setTimeout(() => { if ($('#status').textContent === s) $('#status').textContent = before; }, 1500);
}
init();
</script>
