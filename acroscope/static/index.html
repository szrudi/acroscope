<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acroscope</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f25; --line:#2b3039; --fg:#e6e8ec; --dim:#9aa3b2; --acc:#f5a524; --acc2:#4cc2ff; --bad:#ff6b6b; --ok:#5fd68b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; height:100vh; display:grid; grid-template-rows:44px 1fr; }
  header { display:flex; align-items:center; gap:14px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel) }
  header h1 { font-size:16px; margin:0; color:var(--acc); letter-spacing:.5px }
  header select { background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:4px 8px; border-radius:6px; font-size:14px }
  header .keys { margin-left:auto; color:var(--dim); font-size:12px; white-space:nowrap; flex:none }
  header #status { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }   /* one line, never wraps the header */
  .snote { color:var(--dim); font-size:13px; white-space:pre-wrap }
  kbd { background:#2a2f38; border:1px solid #3a404b; border-radius:4px; padding:0 5px; font:12px ui-monospace, monospace }
  main { display:grid; grid-template-columns:260px 1fr 360px; min-height:0 }
  aside, section { min-height:0; overflow:auto }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column }
  aside .tabs { display:flex; border-bottom:1px solid var(--line); flex:none }
  aside .tab { flex:1; text-align:center; padding:7px 0; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); cursor:pointer; user-select:none }
  aside .tab.on { color:var(--fg); border-bottom:2px solid var(--acc) }
  aside .pane-body { overflow:auto; min-height:0; flex:1 }
  .log { padding:8px 12px 4px; border-bottom:1px solid var(--line) }
  .log .f { font-weight:600; font-size:12px } .log .cov { color:var(--dim); font-size:12px }
  .log .cov b { color:var(--acc2); font-weight:500 } .log .cov .miss { color:var(--bad) }
  .boot { padding:6px 12px 2px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.5px }
  .arm { padding:3px 12px 3px 18px; display:grid; grid-template-columns:52px 46px 1fr; gap:0 8px; font-size:12px; font-variant-numeric:tabular-nums; cursor:default }
  .arm.has { cursor:pointer } .arm.has:hover { background:#232832 }
  .arm .n { color:var(--fg) } .arm .l { color:var(--dim) } .arm .c b { color:var(--acc2); font-weight:500 } .arm .c .no { color:var(--bad) }
  .arm .c .flag { color:var(--dim) }
  .batch { padding:8px 12px; border-bottom:1px solid var(--line); font-size:12px }
  .batch .id { font-weight:600 } .batch .st { color:var(--dim) } .batch .st.failed { color:var(--bad) } .batch .st.done { color:var(--ok) }
  .batch .err { color:var(--bad); white-space:pre-wrap } .batch .pg { height:4px; background:#0f1115; border-radius:2px; margin-top:4px } .batch .pg i { display:block; height:4px; background:var(--acc2); border-radius:2px }
  .clip .mv { float:right; opacity:0; font-size:11px } .clip:hover .mv { opacity:.8 }
  header button.small { padding:2px 6px }
  .right { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden }
  .clip { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:2px 8px }
  .clip:hover { background:#232832 } .clip.on { background:#2a3140; border-left:3px solid var(--acc) }
  .clip .n { font-weight:600 } .clip .d { color:var(--dim); font-variant-numeric:tabular-nums }
  .clip .arms { grid-column:1/3; color:var(--dim); font-size:12px } .clip .arms b { color:var(--acc2); font-weight:500 }
  .clip .warn { color:var(--bad) } .clip .cnt { color:var(--acc) }
  .clip.gone { opacity:.55 } .clip.gone .n { text-decoration:line-through }
  .center { display:flex; flex-direction:column; padding:10px 14px; gap:8px }
  video { width:100%; max-height:62vh; background:#000; border-radius:6px; outline:none }
  #strip { width:100%; height:54px; display:block; cursor:pointer; border-radius:4px; background:#0f1115 }
  .readout { display:flex; gap:18px; color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; min-height:20px }
  .readout b { color:var(--fg); font-weight:500 }
  .editor { display:none; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:var(--panel); gap:8px; flex-direction:column }
  .editor.open { display:flex }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  input, textarea { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit }
  input.t { width:80px; font-variant-numeric:tabular-nums } input.title { flex:1; min-width:200px } textarea { width:100%; min-height:54px; resize:vertical }
  button { background:#2a2f38; color:var(--fg); border:1px solid #3a404b; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit }
  button:hover { background:#343a46 } button.primary { background:var(--acc); color:#1a1200; border-color:var(--acc); font-weight:600 }
  button.small { padding:2px 7px; font-size:12px }
  .chip { display:inline-block; padding:2px 9px; border-radius:12px; border:1px solid var(--c, var(--line)); cursor:pointer; font-size:12px; user-select:none }
  .chip.on { background:var(--c, var(--acc2)); color:#111; border-color:var(--c, var(--acc2)) }
  .chip .n { opacity:.7; margin-left:4px; font-size:11px }
  .tag { display:inline-block; padding:0 7px; border-radius:10px; font-size:11px; background:#2f3542; color:var(--c, var(--acc2)); margin-right:3px }
  .tagbar { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; min-height:22px }
  .cat { color:var(--dim); text-transform:uppercase; letter-spacing:.5px; font-size:11px; margin-left:10px; cursor:pointer; user-select:none }
  .cat:first-child { margin-left:0 } .cat.on { color:var(--fg) }
  .tagbar .mgr { margin-left:auto }
  #tagmgr .row { gap:6px } #tagmgr input[type=color] { width:28px; height:24px; padding:0; border:0; background:none; cursor:pointer }
  #tagmgr select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit }
  .right h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0; padding:10px 12px 6px; display:flex; align-items:center; gap:8px }
  .right h2 label { font-weight:400; text-transform:none; letter-spacing:0; margin-left:auto; cursor:pointer }
  /* each pane takes its content height, shrinks (and scrolls) when the two together overflow, never grows into a gap */
  .pane { display:flex; flex-direction:column; flex:0 1 auto; min-height:0; overflow:hidden }
  .pane + .pane { border-top:1px solid var(--line) }
  .pane h2 { flex:none; cursor:pointer; user-select:none } .pane h2::before { content:'\25BE'; width:10px; color:var(--dim) }
  .pane.closed { flex:none } .pane.closed .list { display:none } .pane.closed h2::before { content:'\25B8' }
  .list { flex:1 1 auto; min-height:0; overflow:auto }
  .m { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:52px 1fr auto; gap:2px 8px; align-items:start }
  .m:hover { background:#232832 } .m.on { background:#2a3140; border-left:3px solid var(--acc) }
  .m img { width:52px; height:35px; object-fit:cover; border-radius:3px; background:#000; grid-row:1/3 }
  .m .t { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums }
  .m .ttl { font-weight:500 } .m .note { grid-column:2/4; color:var(--dim); font-size:12px; white-space:pre-wrap; display:none } .m.on .note { display:block }
  .m .act { display:flex; gap:4px; grid-row:1/3; align-self:center }
  .empty { padding:12px; color:var(--dim) }
  .why { grid-column:2/4; color:var(--dim); font-size:12px }
  @media (max-width: 1400px) { header .keys { display:none } }
  @media (max-width: 1000px) { main { grid-template-columns:1fr } aside, .right { border:0; border-top:1px solid var(--line) } .right { min-height:auto; overflow:visible } .list { max-height:40vh } video { max-height:45vh } }
</style>
</head>
<body>
<header>
  <h1>acroscope</h1>
  <select id="session"></select>
  <button class="small" id="renameSession" title="rename this session (YYYY-MM-DD-name); the date is the first ten characters">✎</button>
  <span id="status" style="color:var(--dim)"></span>
  <span class="keys"><kbd>space</kbd> play <kbd>←</kbd><kbd>→</kbd> 2 s <kbd>,</kbd><kbd>.</kbd> frame <kbd>i</kbd><kbd>o</kbd> in/out <kbd>t</kbd> tag <kbd>n</kbd><kbd>p</kbd> next/prev <kbd>l</kbd> loop</span>
</header>
<main>
  <aside>
    <div class="tabs"><span class="tab on" data-tab="clips">clips</span><span class="tab" data-tab="logs">logs</span><span class="tab" data-tab="inbox">inbox <span id="inboxCount"></span></span></div>
    <div class="pane-body" id="clips"></div>
    <div class="pane-body" id="logs" style="display:none"></div>
    <div class="pane-body" id="inbox" style="display:none"></div>
  </aside>
  <section class="center">
    <video id="v" controls preload="metadata"></video>
    <canvas id="strip" height="54"></canvas>
    <div class="tagbar" id="tagbar"></div>
    <div class="readout" id="readout"></div>
    <div class="snote" id="snote"></div>
    <div class="editor" id="editor">
      <div class="row">
        <span id="edId" style="color:var(--dim);min-width:40px"></span>
        in <input class="t" id="edIn"> <button class="small" onclick="setIn()">now</button>
        out <input class="t" id="edOut"> <button class="small" onclick="setOut()">now</button>
        <input class="title" id="edTitle" placeholder="title">
      </div>
      <div class="row" id="edTags"></div>
      <textarea id="edNote" placeholder="note"></textarea>
      <div class="row"><button class="primary" onclick="saveMoment()">save</button><button onclick="closeEditor()">cancel</button>
        <span id="edWhy" style="color:var(--dim);font-size:12px"></span></div>
    </div>
    <div class="editor" id="tagmgr"></div>
  </section>
  <div class="right">
    <div class="pane" id="paneMoments">
      <h2>moments <span id="mcount"></span><label><input type="checkbox" id="allClips"> all clips</label></h2>
      <div class="list" id="moments"></div>
    </div>
    <div class="pane" id="paneSugg">
      <h2>suggested (untagged) <span id="scount"></span></h2>
      <div class="list" id="sugg"></div>
    </div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const v = $('#v'), strip = $('#strip'), ctx = strip.getContext('2d');
let S = null, clip = null, series = [], sugg = [], TAGS = {categories: [], tags: []}, cur = null, loopM = null, armLen = {};
let filter = new Set();   // tags selected in the bar under the strip; empty = everything. The list and the markers follow it.
const tagDef = t => TAGS.tags.find(x => x.name === t);
const catDef = c => TAGS.categories.find(x => x.name === c);
const tagColor = t => tagDef(t)?.color || catDef(tagDef(t)?.category)?.color || '#9aa3b2';
const passes = m => !filter.size || (m.tags || []).some(t => filter.has(t));
const pill = t => `<span class="tag" style="--c:${tagColor(t)}">${esc(t)}</span>`;
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); return m + ':' + (t - m * 60).toFixed(1).padStart(4, '0'); };
const parse = s => { s = String(s).trim(); if (s.includes(':')) { const [m, x] = s.split(':'); return +m * 60 + +x; } return +s; };
const api = (p, o) => fetch(p, o).then(r => r.json());
// a clip's readable name ("2026-10-07_007") and its short form ("007"); the file name on disk is its id
const clipName = f => (S && S.videos.find(x => x.file === f)?.name) || f.replace(/\.[^.]+$/, '');
const clipNum = f => { const n = clipName(f); const m = n.match(/_(\d{3})$/); return m ? m[1] : n; };
const canHevc = v.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"') || v.canPlayType('video/mp4; codecs="hev1.1.6.L93.B0"');

async function init() {
  $('#status').textContent = 'loading sessions…';
  TAGS = await api('/api/tags');
  const list = await api('/api/sessions');
  const sel = $('#session');
  sel.innerHTML = list.slice().reverse().map(s => `<option value="${s.session}">${s.session} · ${s.videos} clips · ${s.moments} moments</option>`).join('');
  sel.onchange = () => loadSession(sel.value);
  // the URL wins over what was open last time: ?session=…&clip=007&m=m13&t=80.5 is a link to a spot
  const q = new URLSearchParams(location.search);
  if (q.get('tags')) filter = new Set(q.get('tags').split(',').filter(Boolean));
  const want = q.get('session') || localStorage.getItem('acro.session');
  sel.value = list.some(s => s.session === want) ? want : (list.filter(s => s.moments).pop() || list[list.length - 1]).session;
  await loadSession(sel.value, q.get('clip') || localStorage.getItem('acro.clip'));
  if (q.get('m') && S.moments.some(m => m.id === q.get('m'))) playMoment(q.get('m'));
  else if (q.get('t') && clip) { v.currentTime = +q.get('t'); setUrl(); }
}

// keep the address bar a link to what is on screen (no history entries: back/forward stay the browser's)
function setUrl() {
  if (!S) return;
  const q = new URLSearchParams({session: S.session});
  if (clip) q.set('clip', clipNum(clip));
  if (cur) q.set('m', cur);
  else if (clip && v.paused && v.currentTime > 0) q.set('t', v.currentTime.toFixed(1));
  if (filter.size) q.set('tags', [...filter].join(','));
  history.replaceState(null, '', '?' + q.toString());
}
function momentLink(id) { const m = S.moments.find(x => x.id === id); return `${location.origin}/?${new URLSearchParams({session: S.session, clip: clipNum(m.video), m: id})}`; }
async function copyLink(id) {
  try { await navigator.clipboard.writeText(momentLink(id)); flash('link copied'); } catch { prompt('link', momentLink(id)); }
}

async function loadSession(name, wantClip) {
  $('#status').textContent = 'loading…';
  S = await api('/api/session/' + encodeURIComponent(name));
  localStorage.setItem('acro.session', name);
  armLen = {}; for (const a of S.arms || []) armLen[a.bbl + '#' + a.index] = a;
  const pending = (S.arms_pending || []).length || S.probe_pending;
  $('#status').textContent = pending ? ((S.arms_pending || []).length ? 'decoding blackbox in the background, arms appear when done…' : 'probing clips…') : '';
  $('#snote').textContent = S.note || '';
  clearTimeout(window._poll);
  if (pending) window._poll = setTimeout(() => { if (S.session === name) refreshSession(); }, 8000);
  renderClips();
  const c = S.videos.find(x => x.file === wantClip || (wantClip && (x.name === wantClip || clipNum(x.file) === wantClip.padStart(3, '0'))))
    || S.videos.find(x => S.moments.some(m => m.video === x.file)) || S.videos[0];
  if (c) await loadClip(c.file); else { clip = null; v.removeAttribute('src'); renderMoments(); drawStrip(); setUrl(); }
}

async function refreshSession() {
  const name = S.session, keep = clip;
  const n = await api('/api/session/' + encodeURIComponent(name));
  if (S.session !== name) return;
  S = n; armLen = {}; for (const a of S.arms || []) armLen[a.bbl + '#' + a.index] = a;
  const pending = (S.arms_pending || []).length || S.probe_pending;
  $('#status').textContent = pending ? 'decoding blackbox in the background…' : '';
  $('#snote').textContent = S.note || '';
  renderClips(); drawStrip();
  if (keep && !pending) { series = await api(`/api/session/${encodeURIComponent(name)}/series?video=${encodeURIComponent(keep)}`); sugg = await api(`/api/session/${encodeURIComponent(name)}/events?video=${encodeURIComponent(keep)}`); renderSugg(); drawStrip(); }
  if (pending) window._poll = setTimeout(refreshSession, 8000);
}

function renderClips() {
  $('#clips').innerHTML = S.videos.map(x => {
    const ms = S.matches.filter(m => m.video === x.file);
    const n = S.moments.filter(m => m.video === x.file).length;
    const arms = ms.length ? ms.map(m => `<b>arm ${m.arm}</b> +${m.offset}s`).join(', ') : 'no log';
    const warn = x.missing_since ? ` <span class="warn">file missing since ${x.missing_since.slice(0, 10)}</span>` : (x.codec === 'hevc' && !canHevc) ? ' <span class="warn">H.265: this browser may not play it</span>' : '';
    return `<div class="clip ${clip === x.file ? 'on' : ''} ${x.missing_since ? 'gone' : ''}" data-f="${x.file}" title="${esc(x.name || x.file)}"><span class="n">${esc(clipNum(x.file))}<button class="small mv" data-mv="${x.file}" title="move this clip to another session">⇄</button></span><span class="d">${x.duration ? fmt(x.duration) : '?'}${n ? ` <span class="cnt">●${n}</span>` : ''}</span><span class="arms">${arms}${warn}</span>${x.note ? `<span class="arms">${x.note}</span>` : ''}</div>`;
  }).join('') || '<div class="empty">no clips</div>';
  document.querySelectorAll('.clip').forEach(el => el.onclick = e => { if (e.target.dataset.mv) return moveClip(e.target.dataset.mv); loadClip(el.dataset.f); });
  renderLogs();
}

// ---- editing sessions: rename (the date is the name's first ten characters), move a clip; both save at once
async function renameSession() {
  const name = prompt('session name (YYYY-MM-DD or YYYY-MM-DD-name)', S.session);
  if (!name || name === S.session) return;
  const r = await api(`/api/session/${encodeURIComponent(S.session)}/rename`, {method: 'POST', body: JSON.stringify({name})});
  if (r.error) { alert(r.error); return; }
  await init(); $('#session').value = name; await loadSession(name, clip);
}
async function moveClip(file) {
  const others = [...$('#session').options].map(o => o.value).filter(n => n !== S.session);
  const to = prompt(`move ${clipName(file)} to session (existing: ${others.slice(0, 6).join(', ')}${others.length > 6 ? ', …' : ''}; or a new YYYY-MM-DD-name)`, S.session);
  if (!to || to === S.session) return;
  const r = await api(`/api/session/${encodeURIComponent(S.session)}/move`, {method: 'POST', body: JSON.stringify({video: file, to})});
  if (r.error) { alert(r.error); return; }
  flash(`${clipName(file)} moved to ${to}`);
  await init(); $('#session').value = S.session; await loadSession(S.session, clip === file ? null : clip);
}
$('#renameSession').onclick = renameSession;

// ---- the inbox tab: batches the laptop dropped, what the server did with them, a retry for a failed one
async function renderInbox() {
  const rows = await api('/api/inbox');
  const open = rows.filter(b => b.status !== 'done');
  $('#inboxCount').textContent = open.length ? `(${open.length})` : '';
  $('#inbox').innerHTML = rows.slice().reverse().map(b => {
    const p = b.progress || {};
    const pg = b.status === 'running' && p.pct != null ? `<div class="pg"><i style="width:${p.pct}%"></i></div>` : '';
    const line = b.status === 'running' ? `${p.step || ''} ${p.clip || ''} ${p.pct != null ? p.pct + '%' : ''}` : b.status === 'arriving' ? 'still arriving (no .done yet)' : '';
    return `<div class="batch"><span class="id">${esc(b.id)}</span> <span class="st ${b.status}">${esc(b.status)}</span>` +
      (b.session ? ` → <b>${esc(b.session)}</b>` : '') + `<div class="st">${b.clips ?? '?'} clips · ${b.logs ?? '?'} logs ${esc(line)}</div>${pg}` +
      (b.error ? `<div class="err">${esc(b.error)}</div><button class="small" data-retry="${esc(b.id)}">retry</button>` : '') + `</div>`;
  }).join('') || '<div class="empty">inbox empty: the laptop drops batches into inbox/&lt;batch&gt;/ with a .done marker</div>';
  $('#inbox').querySelectorAll('[data-retry]').forEach(el => el.onclick = async () => { await api(`/api/inbox/${encodeURIComponent(el.dataset.retry)}/retry`, {method: 'POST'}); renderInbox(); });
}
setInterval(() => { if ($('#inbox').style.display !== 'none') renderInbox(); }, 10000);
renderInbox();

// ---- the logs tab: every log of the session by power cycle, each arm with the clip that covers it, or without one
function renderLogs() {
  const arms = S.arms || [], boots = S.boots || {};
  let h = '';
  for (const b of S.blackbox || []) {
    const rows = arms.filter(a => a.bbl === b);
    const short = b.length > 40 ? b.slice(25, 40) : b;
    if ((S.arms_pending || []).includes(b)) { h += `<div class="log"><div class="f">${esc(short)}</div><div class="cov">decoding in the background…</div></div>`; continue; }
    if (!rows.length) { h += `<div class="log"><div class="f">${esc(short)}</div><div class="cov">no arms</div></div>`; continue; }
    const flown = rows.filter(a => a.motors_spun !== false), covered = flown.filter(a => a.videos.length);
    const secs = xs => xs.reduce((t, a) => t + (a.length || 0), 0);
    h += `<div class="log"><div class="f" title="${esc(b)}">${esc(short)}</div><div class="cov">${rows.length} arms · <b>${covered.length}</b> with a clip` +
      (flown.length - covered.length ? ` · <span class="miss">${flown.length - covered.length} without</span> (${fmt(secs(flown) - secs(covered))} of flight)` : '') + `</div></div>`;
    const groups = (boots[b] && boots[b].length) ? boots[b] : [{first: rows[0].index, last: rows[rows.length - 1].index, arms: rows.map(a => a.index)}];
    for (const g of groups) {
      if (groups.length > 1) h += `<div class="boot">boot: arms ${g.first}–${g.last}</div>`;
      for (const a of rows.filter(a => g.arms.includes(a.index))) {
        const v = a.videos[0];
        const flags = (a.motors_spun === false ? ' <span class="flag">motors off</span>' : '') + (a.complete === false ? ' <span class="flag">cut off</span>' : '');
        const c = v ? `<b>${esc(clipNum(v.video))}</b> +${v.offset}s` + (a.videos.length > 1 ? ` +${a.videos.length - 1}` : '') : (a.motors_spun === false ? '<span class="flag">no clip</span>' : '<span class="no">no clip</span>');
        h += `<div class="arm ${v ? 'has' : ''}" ${v ? `data-v="${esc(v.video)}" data-t="${v.offset}"` : ''}><span class="n">arm ${a.index}</span><span class="l">${fmt(a.length)}</span><span class="c">${c}${flags}</span></div>`;
      }
    }
  }
  $('#logs').innerHTML = h || '<div class="empty">no blackbox file in this session</div>';
  $('#logs').querySelectorAll('.arm.has').forEach(el => el.onclick = async () => {
    const t = Math.max(0, +el.dataset.t + 0.5);
    if (clip !== el.dataset.v) await loadClip(el.dataset.v);
    v.currentTime = t; v.play();
  });
}
document.querySelectorAll('aside .tab').forEach(tb => tb.onclick = () => {
  document.querySelectorAll('aside .tab').forEach(x => x.classList.toggle('on', x === tb));
  for (const t of ['clips', 'logs', 'inbox']) $('#' + t).style.display = tb.dataset.tab === t ? '' : 'none';
  if (tb.dataset.tab === 'inbox') renderInbox();
  localStorage.setItem('acro.tab', tb.dataset.tab);
});
{ const t = localStorage.getItem('acro.tab'); if (t && t !== 'clips') document.querySelector(`aside .tab[data-tab=${t}]`)?.click(); }

async function loadClip(file) {
  clip = file; cur = null; loopM = null; closeEditor();
  localStorage.setItem('acro.clip', file); setUrl();
  const gone = S.videos.find(x => x.file === file)?.missing_since;
  if (gone) { v.removeAttribute('src'); v.load(); } else v.src = `/video/${encodeURIComponent(S.session)}/${encodeURIComponent(file)}`;
  renderClips(); renderMoments(); drawStrip();
  if (gone) $('#readout').innerHTML = `<b style="color:var(--bad)">file missing since ${gone.slice(0, 10)}</b> its moments and matches are kept until purged`;
  series = await api(`/api/session/${encodeURIComponent(S.session)}/series?video=${encodeURIComponent(file)}`);
  sugg = await api(`/api/session/${encodeURIComponent(S.session)}/events?video=${encodeURIComponent(file)}`);
  renderSugg(); drawStrip();
}

function momentsBase() { return $('#allClips').checked ? S.moments : S.moments.filter(m => m.video === clip); }
function momentsShown() { return momentsBase().filter(passes); }

// ---- the tag bar under the strip: the session's tags by category with counts; clicking filters the timeline
function renderTagbar() {
  const use = {};
  for (const m of momentsBase()) for (const t of m.tags || []) use[t] = (use[t] || 0) + 1;
  const groups = TAGS.categories.map(c => [c.name, TAGS.tags.filter(t => t.category === c.name && use[t.name]).map(t => t.name)]);
  const loose = Object.keys(use).filter(t => !tagDef(t)).sort();
  if (loose.length) groups.push(['other', loose]);
  let h = '';
  for (const [c, ts] of groups) {
    if (!ts.length) continue;
    const allOn = ts.every(t => filter.has(t));
    h += `<span class="cat ${allOn ? 'on' : ''}" data-c="${esc(c)}" title="toggle the whole category">${esc(c)}</span>`;
    h += ts.map(t => `<span class="chip ${filter.has(t) ? 'on' : ''}" data-t="${esc(t)}" style="--c:${tagColor(t)}">${esc(t)}<span class="n">${use[t]}</span></span>`).join('');
  }
  if (filter.size) h += ` <button class="small" id="clearFilter">clear</button>`;
  h += `<button class="small mgr" id="openTagMgr" title="categories, tags, colours">⚙ tags</button>`;
  $('#tagbar').innerHTML = h;
  const groupOf = c => (groups.find(g => g[0] === c) || [c, []])[1];
  $('#tagbar').querySelectorAll('.chip').forEach(el => el.onclick = () => { const t = el.dataset.t; filter.has(t) ? filter.delete(t) : filter.add(t); applyFilter(); });
  $('#tagbar').querySelectorAll('.cat').forEach(el => el.onclick = () => { const ts = groupOf(el.dataset.c); const allOn = ts.every(t => filter.has(t)); ts.forEach(t => allOn ? filter.delete(t) : filter.add(t)); applyFilter(); });
  const cf = $('#clearFilter'); if (cf) cf.onclick = () => { filter.clear(); applyFilter(); };
  $('#openTagMgr').onclick = openTagMgr;
}
function applyFilter() { renderMoments(); renderSugg(); drawStrip(); setUrl(); }

// ---- categories, tags and colours (changes are saved as they are made)
async function openTagMgr() {
  const box = $('#tagmgr'); box.classList.add('open');
  const sel = (cur) => `<select data-cat>${TAGS.categories.map(c => `<option ${c.name === cur ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  box.innerHTML = `<div class="row"><b>categories</b></div>` +
    TAGS.categories.map(c => `<div class="row" data-cn="${esc(c.name)}"><span style="min-width:110px">${esc(c.name)}</span><input type="color" value="${c.color}" data-ccolor>` +
      `<button class="small" data-cdel title="remove (only when empty)">✕</button></div>`).join('') +
    `<div class="row"><input id="newCat" placeholder="new category" style="width:140px"><input type="color" id="newCatColor" value="#4cc2ff"><button class="small" id="addCat">add</button></div>` +
    `<div class="row" style="margin-top:6px"><b>tags</b> <span style="color:var(--dim);font-size:12px">a tag without its own colour takes the category's</span></div>` +
    TAGS.tags.map(t => `<div class="row" data-tn="${esc(t.name)}"><span style="min-width:110px">${pill(t.name)}</span>${sel(t.category)}<input type="color" value="${tagColor(t.name)}" data-tcolor>` +
      `<button class="small" data-tclear title="use the category colour">↺</button><button class="small" data-tdel title="drop the definition (moments keep the tag)">✕</button></div>`).join('') +
    `<div class="row"><input id="newTag" placeholder="new tag" style="width:140px">${sel(TAGS.categories[0]?.name)}<button class="small" id="addTag">add</button></div>` +
    `<div class="row"><button onclick="closeTagMgr()">close</button></div>`;
  const reload = async () => { TAGS = await api('/api/tags'); openTagMgr(); applyFilter(); };
  const post = async (p, body) => { const r = await api(p, {method: 'POST', body: JSON.stringify(body)}); if (r.error) alert(r.error); return r; };
  const del = async (p) => { const r = await api(p, {method: 'DELETE'}); if (r.error) alert(r.error); return r; };
  box.querySelectorAll('[data-cn]').forEach(row => {
    row.querySelector('[data-ccolor]').onchange = async e => { await post('/api/tag-categories', {name: row.dataset.cn, color: e.target.value}); reload(); };
    row.querySelector('[data-cdel]').onclick = async () => { await del('/api/tag-categories/' + encodeURIComponent(row.dataset.cn)); reload(); };
  });
  box.querySelectorAll('[data-tn]').forEach(row => {
    const save = async (color) => { await post('/api/tags', {name: row.dataset.tn, category: row.querySelector('[data-cat]').value, color}); reload(); };
    row.querySelector('[data-cat]').onchange = () => save(null);
    row.querySelector('[data-tcolor]').onchange = e => save(e.target.value);
    row.querySelector('[data-tclear]').onclick = () => save('');
    row.querySelector('[data-tdel]').onclick = async () => { await del('/api/tags/' + encodeURIComponent(row.dataset.tn)); reload(); };
  });
  $('#addCat').onclick = async () => { const n = $('#newCat').value.trim(); if (!n) return; await post('/api/tag-categories', {name: n, color: $('#newCatColor').value}); reload(); };
  $('#addTag').onclick = async () => { const n = $('#newTag').value.trim(); if (!n) return; await post('/api/tags', {name: n, category: $('#addTag').previousElementSibling.value}); reload(); };
}
function closeTagMgr() { $('#tagmgr').classList.remove('open'); }

function renderMoments() {
  renderTagbar();
  const ms = momentsShown();
  $('#mcount').textContent = `(${ms.length})`;
  $('#moments').innerHTML = ms.map(m => `<div class="m ${cur === m.id ? 'on' : ''}" data-id="${m.id}">
    <img loading="lazy" src="/frame/${encodeURIComponent(S.session)}/${encodeURIComponent(m.video)}/${(m.start + Math.min(2, (m.end - m.start) / 2)).toFixed(2)}">
    <span class="ttl">${esc(m.title)} ${(m.tags || []).map(pill).join('')}</span>
    <span class="act"><button class="small" data-link="${m.id}" title="copy link">⛓</button><button class="small" data-edit="${m.id}" title="edit">✎</button><button class="small" data-del="${m.id}" title="delete">✕</button></span>
    <span class="t">${$('#allClips').checked ? clipNum(m.video) + ' · ' : ''}${fmt(m.start)}–${fmt(m.end)}${m.metrics ? ' · ' + metricLine(m.metrics) : ''}</span>
    <span class="note">${esc(m.note || '')}</span></div>`).join('') || '<div class="empty">no moments yet: set in/out with <kbd>i</kbd> <kbd>o</kbd>, then <kbd>t</kbd></div>';
  document.querySelectorAll('.m').forEach(el => el.onclick = e => {
    if (e.target.dataset.link) return copyLink(e.target.dataset.link);
    if (e.target.dataset.edit) return editMoment(e.target.dataset.edit);
    if (e.target.dataset.del) return delMoment(e.target.dataset.del);
    playMoment(el.dataset.id);
  });
}
function metricLine(k) { const r = k.rotation_deg || {}; return `r${r.roll ?? 0} p${r.pitch ?? 0} y${r.yaw ?? 0}° · thr ${k.throttle_pct?.min}–${k.throttle_pct?.max}% · ${k.vbat?.min} V`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderSugg() {
  const ms = S.moments.filter(m => m.video === clip);
  const open = sugg.filter(e => !ms.some(m => e.start < m.end + 1 && e.end > m.start - 1 && (m.tags || []).includes(e.tag)))
    .filter(e => !filter.size || filter.has(e.tag));
  $('#scount').textContent = `(${open.length})`;
  $('#sugg').innerHTML = open.map((e, i) => `<div class="m" data-i="${i}"><span style="grid-row:1/3;color:${tagColor(e.tag)}">◇</span>
    <span class="ttl">${esc(e.title)} ${pill(e.tag)}</span><span class="act"><button class="small" data-acc="${i}">accept</button></span>
    <span class="t">${fmt(e.start)}–${fmt(e.end)}</span><span class="why">${esc(e.why)}</span></div>`).join('') || '<div class="empty">' + (series.length ? 'nothing untagged' : 'no blackbox match for this clip') + '</div>';
  document.querySelectorAll('#sugg .m').forEach(el => el.onclick = e => {
    const s = open[+el.dataset.i];
    if (e.target.dataset.acc !== undefined) return openEditor({video: clip, start: s.start, end: s.end, title: s.title, tags: [s.tag], note: '', why: s.why, metrics: s.numbers});
    v.currentTime = Math.max(0, s.start - 0.5); v.play();
  });
  window._open = open;
}

// ---- playback
function playMoment(id) {
  const m = S.moments.find(x => x.id === id); if (!m) return;
  if (m.video !== clip) { loadClip(m.video).then(() => playMoment(id)); return; }
  cur = id; v.currentTime = m.start; v.play(); renderMoments(); setUrl();
  document.querySelector(`.m[data-id="${id}"]`)?.scrollIntoView({block: 'nearest'});
}
function step(d) { const ms = momentsShown(); if (!ms.length) return; const i = ms.findIndex(m => m.id === cur); playMoment(ms[(i + d + ms.length) % ms.length].id); }
v.addEventListener('timeupdate', () => {
  if (loopM) { const m = S.moments.find(x => x.id === loopM); if (m && (v.currentTime >= m.end || v.currentTime < m.start - 0.3)) v.currentTime = m.start; }
  drawStrip(); readout();
});
v.addEventListener('loadedmetadata', drawStrip);
for (const ev of ['pause', 'seeked', 'play']) v.addEventListener(ev, setUrl);   // paused: the URL carries the time
v.addEventListener('error', () => { $('#readout').innerHTML = `<b style="color:var(--bad)">cannot play this clip</b> (${clip}: ${canHevc ? 'load error' : 'H.265 and this browser has no HEVC decoder; run acroscope transcode'})`; });

function armAt(t) { // series entry whose arm covers video time t
  for (const s of series) { const a = t - s.offset; if (a >= -0.5 && a <= s.length + 0.5) return [s, a]; }
  return [null, null];
}
function readout() {
  const t = v.currentTime; const [s, a] = armAt(t);
  let h = `<span>video <b>${fmt(t)}</b></span>`;
  if (s) {
    const r = s.rows[Math.max(0, Math.min(s.rows.length - 1, Math.round(a / s.step)))];
    h += `<span>arm ${s.arm} <b>${a.toFixed(1)} s</b></span>`;
    if (r) h += `<span>throttle <b>${r[0]} %</b></span><span>tilt <b>${r[1]}°</b></span><span>vbat <b>${r[2].toFixed(2)} V</b></span><span>gyro <b>${r[3]} °/s</b></span>`;
  } else if (series.length) h += '<span>between arms</span>'; else h += '<span>no log</span>';
  if (loopM) h += '<span style="color:var(--acc)">looping</span>';
  $('#readout').innerHTML = h;
}

function drawStrip() {
  const W = strip.width = strip.clientWidth * devicePixelRatio, H = strip.height = 54 * devicePixelRatio;
  ctx.clearRect(0, 0, W, H);
  const D = v.duration || (S && clip && S.videos.find(x => x.file === clip)?.duration) || 0; if (!D) return;
  const X = t => Math.max(0, Math.min(W, t / D * W));
  // arm coverage
  for (const s of series) { ctx.fillStyle = '#1f3a4d'; ctx.fillRect(X(s.offset), H * 0.62, X(s.offset + s.length) - X(s.offset), H * 0.38);
    ctx.fillStyle = '#4cc2ff'; ctx.font = `${10 * devicePixelRatio}px system-ui`; ctx.fillText('arm ' + s.arm, X(s.offset) + 3, H * 0.62 + 11 * devicePixelRatio);
    // throttle trace
    ctx.strokeStyle = '#3d6f8a'; ctx.beginPath();
    s.rows.forEach((r, i) => { if (!r) return; const x = X(s.offset + i * s.step), y = H - r[0] / 100 * H * 0.36; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  }
  // suggestions (hollow) and moments (solid)
  for (const e of (window._open || [])) { ctx.strokeStyle = tagColor(e.tag); ctx.lineWidth = devicePixelRatio; ctx.strokeRect(X(e.start), H * 0.38, Math.max(2, X(e.end) - X(e.start)), H * 0.2); }
  for (const m of S.moments.filter(m => m.video === clip && passes(m))) { ctx.fillStyle = tagColor((m.tags || [])[0]); ctx.globalAlpha = m.id === cur ? 1 : 0.75;
    ctx.fillRect(X(m.start), H * 0.08, Math.max(3, X(m.end) - X(m.start)), H * 0.26); ctx.globalAlpha = 1; }
  // in/out while editing
  if ($('#editor').classList.contains('open')) { const a = parse($('#edIn').value), b = parse($('#edOut').value);
    ctx.fillStyle = 'rgba(245,165,36,.25)'; ctx.fillRect(X(a), 0, Math.max(2, X(b) - X(a)), H); }
  ctx.fillStyle = '#fff'; ctx.fillRect(X(v.currentTime) - devicePixelRatio, 0, 2 * devicePixelRatio, H);
}
strip.onclick = e => { const D = v.duration; if (!D) return; v.currentTime = (e.offsetX / strip.clientWidth) * D; };
window.addEventListener('resize', drawStrip);

// ---- editor
let ed = null;
function openEditor(m) {
  ed = m; $('#editor').classList.add('open');
  $('#edId').textContent = m.id || 'new'; $('#edIn').value = fmt(m.start); $('#edOut').value = fmt(m.end);
  $('#edTitle').value = m.title || ''; $('#edNote').value = m.note || ''; $('#edWhy').textContent = m.why || '';
  const tags = new Set(m.tags || []);
  const chip = t => `<span class="chip ${tags.has(t) ? 'on' : ''}" data-t="${esc(t)}" style="--c:${tagColor(t)}">${esc(t)}</span>`;
  let h = '';
  for (const c of TAGS.categories) { const ts = TAGS.tags.filter(t => t.category === c.name); if (ts.length) h += `<span class="cat">${esc(c.name)}</span>` + ts.map(t => chip(t.name)).join(''); }
  const loose = [...tags].filter(t => !tagDef(t)); if (loose.length) h += `<span class="cat">other</span>` + loose.map(chip).join('');
  $('#edTags').innerHTML = h + ' <input id="edTagFree" placeholder="+tag" style="width:80px">';
  $('#edTags').querySelectorAll('.chip').forEach(c => c.onclick = () => c.classList.toggle('on'));
  $('#edTitle').focus(); drawStrip();
}
function closeEditor() { ed = null; $('#editor').classList.remove('open'); drawStrip(); }
function setIn() { $('#edIn').value = fmt(v.currentTime); drawStrip(); }
function setOut() { $('#edOut').value = fmt(v.currentTime); drawStrip(); }
function editMoment(id) { const m = S.moments.find(x => x.id === id); if (m) openEditor({...m}); }
async function saveMoment() {
  const tags = [...$('#edTags').querySelectorAll('.chip.on')].map(c => c.dataset.t);
  const free = $('#edTagFree').value.trim(); if (free) tags.push(...free.split(/[,\s]+/).filter(Boolean));
  const body = {id: ed.id, video: ed.video || clip, start: parse($('#edIn').value), end: parse($('#edOut').value), title: $('#edTitle').value.trim() || tags[0] || 'moment', tags, note: $('#edNote').value, metrics: ed.metrics};
  if (!(body.end > body.start)) { alert('out must be after in'); return; }
  const m = await api(`/api/session/${encodeURIComponent(S.session)}/moment`, {method: 'POST', body: JSON.stringify(body)});
  if (m.error) { alert(m.error); return; }
  S.moments = [...S.moments.filter(x => x.id !== m.id), m].sort((a, b) => a.video.localeCompare(b.video) || a.start - b.start);
  cur = m.id; closeEditor(); renderClips(); renderMoments(); renderSugg(); drawStrip();
}
async function delMoment(id) {
  const m = S.moments.find(x => x.id === id); if (!m || !confirm(`delete "${m.title}"?`)) return;
  await api(`/api/session/${encodeURIComponent(S.session)}/moment/${id}`, {method: 'DELETE'});
  S.moments = S.moments.filter(x => x.id !== id); if (cur === id) cur = null; if (loopM === id) loopM = null;
  renderClips(); renderMoments(); renderSugg(); drawStrip();
}
$('#allClips').onchange = renderMoments;
// the two right-hand panes fold on their heading (the 'all clips' checkbox excepted); the state survives a reload
document.querySelectorAll('.pane').forEach(p => {
  if (localStorage.getItem('acro.' + p.id)) p.classList.add('closed');
  p.querySelector('h2').onclick = e => { if (e.target.closest('label')) return; p.classList.toggle('closed'); localStorage.setItem('acro.' + p.id, p.classList.contains('closed') ? '1' : ''); };
});

// ---- keys
let inT = null, outT = null;
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) { if (e.key === 'Escape') { e.target.blur(); } if (e.key === 'Enter' && e.target.id === 'edTitle') saveMoment(); return; }
  const k = e.key; let h = true;
  if (k === ' ') v.paused ? v.play() : v.pause();
  else if (k === 'ArrowLeft') v.currentTime -= e.shiftKey ? 10 : 2;
  else if (k === 'ArrowRight') v.currentTime += e.shiftKey ? 10 : 2;
  else if (k === ',') { v.pause(); v.currentTime -= 1 / 60; }
  else if (k === '.') { v.pause(); v.currentTime += 1 / 60; }
  else if (k === 'i') { inT = v.currentTime; if (ed) setIn(); flash('in ' + fmt(inT)); }
  else if (k === 'o') { outT = v.currentTime; if (ed) setOut(); flash('out ' + fmt(outT)); }
  else if (k === 't') { if (!clip) return; const a = inT ?? Math.max(0, v.currentTime - 3), b = outT ?? v.currentTime + 3; openEditor({video: clip, start: Math.min(a, b), end: Math.max(a, b), tags: []}); inT = outT = null; }
  else if (k === 'n') step(1); else if (k === 'p') step(-1);
  else if (k === 'l') { loopM = loopM ? null : cur; readout(); }
  else if (k === 'Escape') closeEditor();
  else h = false;
  if (h) { e.preventDefault(); e.stopPropagation(); }
}, true);   // capture phase: the focused <video controls> would otherwise handle space/arrows too and undo ours
function flash(s) { $('#status').textContent = s; setTimeout(() => $('#status').textContent = '', 1500); }
init();
</script>
</body>
</html>
