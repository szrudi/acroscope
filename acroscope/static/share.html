<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14161a">
<title>__TITLE__</title>
<style>
  :root { --bg:#14161a; --line:#2b3039; --fg:#e6e8ec; --dim:#9aa3b2; --acc:#f5a524; }
  * { box-sizing:border-box }
  html, body { margin:0; background:var(--bg); color:var(--fg) }
  body { font:15px/1.45 system-ui, sans-serif; min-height:100vh; min-height:100dvh; display:flex; justify-content:center }
  main { width:100%; max-width:720px; padding:0 0 32px }
  .vwrap { position:relative; background:#000; line-height:0; cursor:pointer; -webkit-tap-highlight-color:transparent }
  video { width:100%; max-height:72vh; display:block; background:#000 }
  canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
  .bar { height:5px; background:#2a2f38; cursor:pointer } .bar i { display:block; height:5px; width:0; background:var(--acc) }
  .row { display:flex; gap:8px; padding:10px 12px }
  button { background:#2a2f38; color:var(--fg); border:1px solid #3a404b; border-radius:6px; padding:7px 0; cursor:pointer; font:inherit; flex:1; min-width:0; white-space:nowrap }
  button.on { background:var(--acc); color:#1a1200; border-color:var(--acc) }
  .text { margin:4px 14px 0; white-space:pre-wrap; overflow-wrap:anywhere } .text:empty { display:none }
  footer { margin:20px 14px 0; color:var(--dim); font-size:12px; letter-spacing:.5px }
</style>
</head>
<body>
<main>
  <div class="vwrap" id="wrap"><video id="v" src="clip.mp4" autoplay muted loop playsinline preload="auto"></video><canvas id="sticks"></canvas></div>
  <div class="bar" id="bar"><i id="pos"></i></div>
  <div class="row">
    <button id="play" title="play / pause">pause</button>
    <button data-rate="0.25">¼×</button><button data-rate="0.5">½×</button><button data-rate="1" class="on">1×</button>
    <button id="stk" class="on" title="the sticks from the flight log; a tap on the picture does the same">sticks</button>
  </div>
  <p class="text" id="text">__TEXT__</p>
  <footer>acroscope</footer>
</main>
<script>
// One trick, shared: the clip loops, and the sticks it was flown with are drawn over the picture from the samples
// below (Mode 2: throttle and yaw left, pitch and roll right; every axis + = stick right or up, in %; null where the
// log does not cover the picture). The page talks to nothing: the clip beside it is the only other file.
const STICKS = __STICKS__;
const TRAIL = 0.8, $ = s => document.querySelector(s), v = $('#v'), sk = $('#sticks'), skx = sk.getContext('2d');
let show = true, raf = 0;
function sample(i) {           // the sticks at sample i as {lx, ly, rx, ry} in -100..100, or null off the log
  if (!STICKS || i < 0 || i >= STICKS.roll.length || STICKS.roll[i] == null) return null;
  return {lx: STICKS.yaw[i], ly: STICKS.throttle[i] * 2 - 100, rx: STICKS.roll[i], ry: STICKS.pitch[i]};
}
function at(t) {               // between two samples by straight line; the one before alone when the next is off the log
  const f = Math.max(0, t / STICKS.step), i = Math.floor(f), a = sample(i), b = sample(i + 1);
  if (!a) return null;
  if (!b) return a;
  const w = f - i, k = x => a[x] + (b[x] - a[x]) * w;
  return {lx: k('lx'), ly: k('ly'), rx: k('rx'), ry: k('ry')};
}
function drawSticks() {        // returns what it drew, [{box: [x, y, size], dot: [x, y]}] left then right, in canvas px
  const W = sk.width = v.clientWidth * devicePixelRatio, H = sk.height = v.clientHeight * devicePixelRatio;
  skx.clearRect(0, 0, W, H);
  const t = v.currentTime, now = show && STICKS ? at(t) : null;
  if (!now) return [];
  // the picture inside the element (letterboxed when their shapes differ); the gimbals at its bottom centre
  const vw = v.videoWidth || 16, vh = v.videoHeight || 9, sc = Math.min(W / vw, H / vh), pw = vw * sc, ph = vh * sc, d = devicePixelRatio;
  const px = (W - pw) / 2, py = (H - ph) / 2, G = Math.min(pw * 0.13, ph * 0.24), y0 = py + ph - G - ph * 0.06;
  const trail = [];
  for (let i = Math.max(0, Math.ceil((t - TRAIL) / STICKS.step)); i * STICKS.step < t; i++) trail.push(sample(i));
  trail.push(now);
  const drawn = [];
  for (const [x0, kx, ky] of [[px + pw / 2 - G * 1.18, 'lx', 'ly'], [px + pw / 2 + G * 0.18, 'rx', 'ry']]) {
    const P = p => [x0 + (p[kx] + 100) / 200 * G, y0 + (100 - p[ky]) / 200 * G];
    skx.globalAlpha = 1; skx.lineWidth = d;
    skx.fillStyle = 'rgba(0,0,0,.35)'; skx.strokeStyle = 'rgba(255,255,255,.4)';
    skx.beginPath(); skx.roundRect(x0, y0, G, G, G * 0.12); skx.fill(); skx.stroke();
    skx.strokeStyle = 'rgba(255,255,255,.15)';
    skx.beginPath(); skx.moveTo(x0 + G / 2, y0); skx.lineTo(x0 + G / 2, y0 + G); skx.moveTo(x0, y0 + G / 2); skx.lineTo(x0 + G, y0 + G / 2); skx.stroke();
    skx.strokeStyle = '#f5a524'; skx.lineWidth = 2 * d; skx.lineCap = 'round';
    for (let k = 1; k < trail.length; k++) {
      if (!trail[k - 1] || !trail[k]) continue;          // the trail breaks where the log does not cover the picture
      skx.globalAlpha = k / trail.length;
      skx.beginPath(); skx.moveTo(...P(trail[k - 1])); skx.lineTo(...P(trail[k])); skx.stroke();
    }
    skx.globalAlpha = 1; skx.fillStyle = '#fff'; skx.lineWidth = 1.5 * d;
    skx.beginPath(); skx.arc(...P(now), Math.max(3 * d, G * 0.06), 0, 2 * Math.PI); skx.fill(); skx.stroke();
    drawn.push({box: [x0, y0, G], dot: P(now)});
  }
  return drawn;
}
function draw() { drawSticks(); $('#pos').style.width = v.duration ? (100 * v.currentTime / v.duration) + '%' : '0'; }
function loop() { draw(); raf = v.paused || v.ended ? 0 : requestAnimationFrame(loop); }   // timeupdate is ~4 Hz: too slow for a stick
function label() { $('#play').textContent = v.paused ? 'play' : 'pause'; }
v.addEventListener('play', () => { label(); if (!raf) loop(); });
v.addEventListener('pause', label);
for (const ev of ['seeked', 'loadedmetadata', 'timeupdate']) v.addEventListener(ev, draw);
v.addEventListener('loadedmetadata', label);
new ResizeObserver(draw).observe(v);
function toggleSticks() { show = !show; $('#stk').classList.toggle('on', show); drawSticks(); }
if (STICKS) { $('#wrap').onclick = toggleSticks; $('#stk').onclick = toggleSticks; } else $('#stk').remove();
$('#play').onclick = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
for (const b of document.querySelectorAll('[data-rate]')) b.onclick = () => {
  v.playbackRate = +b.dataset.rate;
  for (const o of document.querySelectorAll('[data-rate]')) o.classList.toggle('on', o === b);
};
$('#bar').onclick = e => { if (v.duration) v.currentTime = e.offsetX / e.currentTarget.clientWidth * v.duration; };
label();
</script>
</body>
</html>
