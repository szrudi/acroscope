<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>acroscope · configuration</title>
<meta name="theme-color" content="#14161a">
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<style>
  :root { --bg:#14161a; --panel:#1c1f25; --line:#2b3039; --fg:#e6e8ec; --dim:#9aa3b2; --acc:#f5a524; --acc2:#4cc2ff; --bad:#ff6b6b; --ok:#5fd68b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column }
  header { display:flex; align-items:center; gap:14px; padding:0 14px; height:44px; border-bottom:1px solid var(--line); background:var(--panel); flex:none }
  header h1 { font-size:16px; margin:0; color:var(--acc); letter-spacing:.5px; white-space:nowrap } header h1 a { color:inherit; text-decoration:none } header h1 span { color:var(--dim); font-weight:400 }
  header #status { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); font-size:13px }
  .tabs { display:flex; border-bottom:1px solid var(--line); background:var(--panel); flex:none }
  .tabs span { flex:1; text-align:center; padding:9px 0; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); cursor:pointer; user-select:none }
  .tabs span.on { color:var(--fg); box-shadow:inset 0 -2px 0 var(--acc) }
  main { flex:1; min-height:0; overflow:auto; padding:12px 14px 24px; max-width:1100px; width:100%; margin:0 auto }
  section[data-panel] { display:none } section[data-panel].on { display:block }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:16px 0 8px } h2:first-child { margin-top:4px }
  p.hint { color:var(--dim); font-size:13px; margin:0 0 10px }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0 }
  input, textarea, select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit }
  input[type=number] { width:96px; font-variant-numeric:tabular-nums } textarea { width:100%; min-height:160px; resize:vertical; font:12px ui-monospace, monospace }
  input[type=color] { width:28px; height:24px; padding:0; border:0; background:none; cursor:pointer }
  button { background:#2a2f38; color:var(--fg); border:1px solid #3a404b; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit }
  button:hover { background:#343a46 } button.primary { background:var(--acc); color:#1a1200; border-color:var(--acc); font-weight:600 }
  button.small { padding:2px 7px; font-size:12px } button:disabled, button:disabled:hover { opacity:.45; cursor:default; background:#2a2f38 }
  a.btn { background:#2a2f38; color:var(--fg); border:1px solid #3a404b; border-radius:6px; padding:2px 7px; font-size:12px; line-height:1.4; text-decoration:none; white-space:nowrap } a.btn:hover { background:#343a46 }
  .chip { display:inline-block; padding:2px 9px; border-radius:12px; border:1px solid var(--c, var(--line)); cursor:pointer; font-size:12px; user-select:none }
  .chip.on { background:var(--c, var(--acc2)); color:#111; border-color:var(--c, var(--acc2)) }
  .chip .n { display:inline-block; min-width:14px; padding:0 4px; margin-left:2px; border-radius:7px; background:var(--acc); color:#111; font-size:10px; text-align:center }
  .tag { display:inline-block; padding:0 7px; border-radius:10px; font-size:11px; background:#2f3542; color:var(--c, var(--acc2)) }
  .src { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:10px; padding:0 7px; white-space:nowrap }
  .src.db { color:var(--acc); border-color:var(--acc) } .src.preset { color:var(--acc2); border-color:var(--acc2) } .src.craft { color:var(--ok); border-color:var(--ok) }
  #err { display:none; color:var(--bad); background:#2a1d1d; border:1px solid var(--bad); border-radius:8px; padding:8px 12px; margin:0 0 10px; white-space:pre-wrap }
  #err.on { display:block }
  .prm { display:grid; grid-template-columns:minmax(0, 1fr) 110px 70px minmax(90px, auto); gap:4px 10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line) }
  .prm .nm { font-weight:500 } .prm .used { color:var(--dim); font-size:11px; display:block } .prm .def { color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px }
  .prm .act { display:flex; gap:6px; align-items:center; justify-content:flex-end }
  .prm.over input { border-color:var(--acc) }
  .trk { border-bottom:1px solid var(--line); padding:6px 0 }
  .trk .head { display:grid; grid-template-columns:24px minmax(0, 1fr) auto; gap:8px; align-items:center; cursor:pointer; min-height:30px }
  .trk .head .id { font-weight:600 } .trk .head .meta { color:var(--dim); font-size:12px } .trk.off .head .id, .trk.off .head .meta { opacity:.5; text-decoration:line-through }
  .trk .det { display:none; padding:4px 0 6px 32px; color:var(--dim); font-size:12px } .trk.open .det { display:block }
  .trk .chev { color:var(--dim); font-size:12px; white-space:nowrap } .trk.open .chev { color:var(--fg) }
  .trk .det .nums { margin:0 0 6px; font-size:14px; color:var(--fg) }
  .trk .det .def-lines > summary { cursor:pointer; color:var(--dim); font-size:12px; padding:4px 0; list-style:none } .trk .det .def-lines > summary::-webkit-details-marker { display:none }
  .trk .det .def-lines > summary::before { content:'› '; } .trk .det .def-lines[open] > summary::before { content:'⌄ '; }
  .lbl { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); min-width:44px }
  .segs { display:inline-flex; flex-wrap:nowrap } label.seg { display:inline-flex; cursor:pointer } label.seg input { position:absolute; opacity:0; pointer-events:none }
  label.seg span { padding:3px 11px; border:1px solid var(--line); font-size:13px; color:var(--dim) } label.seg:first-of-type span { border-radius:6px 0 0 6px }
  label.seg:last-of-type span { border-radius:0 6px 6px 0 } label.seg + label.seg span { border-left:0 } label.seg input:checked + span { background:var(--acc2); color:#111; border-color:var(--acc2) }
  label.seg input:focus-visible + span { outline:2px solid var(--acc) }
  label.prop { display:inline-flex; align-items:center; gap:6px; color:var(--dim); margin-right:10px } label.prop input[type=number] { width:72px }
  .mine { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:10px 0 4px; background:var(--panel) }
  .mine .it { display:inline-flex; gap:6px; align-items:center } .mine .it b { color:var(--acc); font-weight:600 }
  details.fold { border-top:1px solid var(--line); margin-top:16px } details.fold > summary { list-style:none; cursor:pointer; padding:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); user-select:none }
  details.fold > summary::-webkit-details-marker { display:none } details.fold > summary::before { content:'›'; display:inline-block; width:14px; transition:transform .15s } details.fold[open] > summary::before { transform:rotate(90deg) }
  body.phone .trk .det { padding-left:0 } body.phone label.seg span { padding:4px 8px } body.phone label.prop { margin-right:4px } body.phone label.prop input[type=number] { width:60px }
  body.phone header #status { flex:1 0 100%; order:3; white-space:normal }
  .trk .det code { color:var(--fg); font:12px ui-monospace, monospace; background:#0f1115; padding:1px 5px; border-radius:4px; display:inline-block; margin:1px 0 }
  .trk .det .k { color:var(--dim); display:inline-block; min-width:72px }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px } .kv b { color:var(--dim); font-weight:500 }
  table.ev { border-collapse:collapse; font-size:13px; margin:6px 0 } table.ev td, table.ev th { padding:3px 10px 3px 0; text-align:left; border-bottom:1px solid var(--line) } table.ev th { color:var(--dim); font-weight:500 }
  .ok { color:var(--ok) } .bad { color:var(--bad) } .dim { color:var(--dim) }
  .shrow { display:grid; grid-template-columns:72px minmax(0, 1fr) auto; gap:4px 10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line) }
  .shrow .st { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim) } .shrow .st.active { color:var(--ok) } .shrow .st.expired { color:var(--acc) } .shrow .st.revoked { color:var(--bad) }
  .shrow .what { min-width:0 } .shrow .what b { font-weight:500 } .shrow .what .dim { display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .shrow .act { display:flex; gap:6px; align-items:center; white-space:nowrap }
  body.phone .shrow { grid-template-columns:72px minmax(0, 1fr) } body.phone .shrow .act { grid-column:2 }
  .pair { border:1px solid var(--acc); border-radius:8px; padding:8px 12px; margin:8px 0 12px } .pair input { flex:1; min-width:0; font:12px ui-monospace, monospace }
  #dvName { flex:1; min-width:0; max-width:320px }
  .list .m { padding:4px 0; border-bottom:1px solid var(--line); font-size:13px } .list .m .t { color:var(--dim); font-variant-numeric:tabular-nums; margin-right:8px }
  #tagsPanel .row { gap:6px }
  body.phone header { height:auto; min-height:44px; flex-wrap:wrap; padding:6px 10px; gap:8px } body.phone header #status { width:100%; font-size:12px }
  body.phone main { padding:10px 10px 70px; order:1 } body.phone .tabs { order:2; position:fixed; left:0; right:0; bottom:0; padding-bottom:env(safe-area-inset-bottom); z-index:3 }
  body.phone .prm { grid-template-columns:minmax(0, 1fr) 90px; } body.phone .prm .def { grid-column:1; } body.phone .prm .act { grid-column:2; justify-content:flex-end }
  body.phone input[type=number] { width:88px; font-size:16px } body.phone select { font-size:16px }
  .osdview { position:relative; width:100%; max-width:720px; background:#000; border:1px solid var(--line); border-radius:6px; overflow:hidden; aspect-ratio:3/2 }
  .osdview img, .osdview canvas { position:absolute; inset:0; width:100%; height:100%; display:block }
  .osdview .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; text-align:center; padding:20px }
  #oRead { font:13px ui-monospace, monospace; margin:8px 0; min-height:18px } #oRead b { color:var(--fg); font-weight:600 } #oRead .dim { margin-left:10px }
  #oWarn div { color:var(--acc); font-size:12px } #oGlyphs canvas { image-rendering:pixelated; background:#3a404b; border-radius:4px }
  .osd-kv { grid-template-columns:70px minmax(0, 1fr); align-items:center } .osd-kv input[type=number] { width:70px } .osd-kv select { max-width:100% }
  #oGlyphsCanvas { max-width:100% }
  body.phone .tabs span { letter-spacing:.5px; font-size:12px; padding:11px 0 }
  #oRank .r { display:grid; grid-template-columns:110px 60px minmax(0, 1fr); gap:8px; padding:3px 0; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px } #oRank .r:hover { background:#20242b }
</style>
</head>
<body>
<header>
  <h1><a href="/"><img src="/static/brand/icon.svg" alt="" style="height:22px;vertical-align:-5px;margin-right:6px" onerror="this.remove()">acroscope</a> <span>› configuration</span></h1>
  <span id="status"></span>
  <a class="btn" href="/" id="toPlayer">← player</a>
</header>
<div class="tabs" id="tabs"><span data-tab="tags">tags</span><span data-tab="shares">shares</span><span data-tab="detection">detection</span><span data-tab="osd">osd</span><span data-tab="devices">devices</span></div>
<main>
  <div id="err"></div>
  <section data-panel="tags" id="tagsPanel"></section>
  <section data-panel="shares" id="sharesPanel"></section>
  <section data-panel="detection" id="detectionPanel"></section>
  <section data-panel="osd" id="osdPanel"></section>
  <section data-panel="devices" id="devicesPanel"></section>
</main>
<script>
// The configuration page (#45): tags, shares, detection (the tricks and the parameters that judge them, for all quads or
// one, the checks, the tricks file and the raw layer), the OSD profiles, and the devices that upload through the drop.
// Everything the pilot sets goes to the server as the whole layer document (POST /api/tricks/layer), shaped like
// the tricks file's tables; the server checks it as it checks a file and refuses a bad one with the place named.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// every answer is {error} when it is not acroscope's JSON (a proxy's 502 page, the network gone), so no caller hangs
const api = (p, o) => fetch(p, o).then(async r => { try { return await r.json(); } catch { return {error: `${r.status} ${r.statusText || ''}: not an answer from acroscope`.trim()}; } },
                                      e => ({error: 'no answer from the server: ' + e.message}));
const SKILLS = ['none', 'beginner', 'advanced'];
let D = null, DC = null, L = {version: 1}, ETAG = null, TAGS = {categories: [], tags: []}, SESS = [], craft = null, tab = null, openTricks = new Set();
// D: the library in force for any quad; DC: for the quad chosen on the detection tab (craft; null is all quads)

function err(msg) { const e = $('#err'); e.textContent = msg || ''; e.classList.toggle('on', !!msg); }
function status(msg) { $('#status').textContent = msg || ''; }
const craftOf = s => (/^(?:database )?craft[ .](.+)$/.exec(s) || [])[1];   // a param's 'craft OttO', a trick's 'database craft.OttO'
function srcBadge(s) {
  const q = craftOf(s);
  const cls = s === 'database' ? 'db' : s.startsWith('preset') ? 'preset' : q ? 'craft' : '';
  // relative to the scope on screen: an override of this scope's own, else where the value comes from
  const label = s === 'database' ? (craft ? 'all quads' : 'override') : q ? (sameCraft(q, craft) ? 'override' : q + ' override')
    : s.startsWith('preset') ? s : s.endsWith('tricks.toml') && s.includes('/tricks/') ? 'shipped' : 'file';
  return `<span class="src ${cls}" title="${esc(s)}">${esc(label)}</span>`;
}
const tagColor = t => { const d = TAGS.tags.find(x => x.name === t); return d?.color || TAGS.categories.find(c => c.name === d?.category)?.color || '#9aa3b2'; };
const pill = t => `<span class="tag" style="--c:${esc(tagColor(t))}">${esc(t)}</span>`;
const num = v => typeof v === 'number' ? (Number.isInteger(v) ? String(v) : String(+v.toFixed(3))) : String(v);

// ---- the layer document: the edits the CLI makes, on the client's copy, then the whole thing to the server
const clone = x => JSON.parse(JSON.stringify(x));
const sameCraft = (a, b) => a === b || (a && b && a.toLowerCase() === b.toLowerCase());     // OttO one day, Otto the next: one quad
const craftKey = (t, c) => Object.keys(t.craft || {}).find(k => sameCraft(k, c)) || c;     // the spelling the layer already uses
function section(t, c) { return c ? ((t.craft ||= {})[craftKey(t, c)] ||= {}) : t; }
const layerCraft = c => (L.craft || {})[craftKey(L, c)] || {};
function tidy(t) {                                   // an emptied table goes, so the layer reads as what was set
  for (const k of ['params', 'trick']) if (t[k] && !Object.keys(t[k]).length) delete t[k];
  if (t.craft) { for (const [c, s] of Object.entries(t.craft)) { tidy(s); if (!Object.keys(s).length) delete t.craft[c]; } if (!Object.keys(t.craft).length) delete t.craft; }
  return t;
}
async function save(next) {
  err('');
  // the etag says which layer this page started from: a save from another tab or the CLI in between is a 409, and
  // the page reloads instead of overwriting it
  const r = await api('/api/tricks/layer?etag=' + encodeURIComponent(ETAG || ''), {method: 'POST', body: JSON.stringify(tidy(next))});
  if (r.error) { err(r.error); if (/changed since/.test(r.error)) await load(); return false; }
  L = r.layer; ETAG = r.etag; await load(); return true;
}
const edit = f => { const t = clone(L); t.version ??= 1; f(t); return save(t); };
const setParam = (name, value, c) => edit(t => { if (value === null) { const p = section(t, c).params || {}; delete p[name]; } else (section(t, c).params ||= {})[name] = value; });
const setTrick = (id, on, c) => edit(t => { const s = section(t, c); s.trick ||= []; let e = s.trick.find(x => x.id === id); if (!e) s.trick.push(e = {id}); e.enabled = on; });   // the entry's other fields stay
const setSkill = (name, c) => edit(t => { const s = section(t, c); if (!name || name === 'none' || name === 'inherit') delete s.skill; else s.skill = name; });
const setProp = (c, key, value) => edit(t => { const s = section(t, c); if (value === null || value === '') delete s[key]; else s[key] = value; });

async function load() {
  // all four or nothing: a failed answer (api() resolves to {error}) must never stand in for the layer, or the next
  // knob would save an empty layer over the pilot's
  const [d, dc, layer, tags] = await Promise.all([api('/api/tricks'), craft ? api('/api/tricks?craft=' + encodeURIComponent(craft)) : null, api('/api/tricks/layer'), api('/api/tags')]);
  const failed = [d, dc, layer, tags].find(x => x && x.error);
  if (failed) { err(failed.error + '\n(nothing loaded; reload the page)'); return; }
  [D, DC, TAGS] = [d, dc, tags];
  L = layer.layer || {version: 1}; ETAG = layer.etag;
  if (D.layer_error) err('your layer is not in force: ' + D.layer_error + '\nThe shipped tricks apply meanwhile; repair or clear the raw layer under detection.');
  render();
}

// ---- detection: what the tricks are, and what judges them, for all quads or one. One tab, summary first: the scope,
// the skill, what the pilot changed (each with its own way back), the tricks with each one's parameters under it; every
// parameter, the checks and the raw layer folded away below.
const openFolds = new Set(), openDefs = new Set();                          // the folded parts the pilot opened, kept across the redraws a save makes
const fold = (id, title, body) => `<details class="fold" data-fold="${id}" ${openFolds.has(id) ? 'open' : ''}><summary>${title}</summary>${body}</details>`;
function paramRows(params, scopeCraft, usedBy, filter, keys, trick) {
  const own = scopeCraft ? layerCraft(scopeCraft).params || {} : L.params || {};
  return Object.entries(params).filter(([k]) => keys ? keys.includes(k) : !filter || k.includes(filter) || (usedBy[k] || []).some(t => t.includes(filter))).map(([k, p]) => {
    const mine = own[k] !== undefined, others = (usedBy[k] || []).filter(x => x !== trick);
    const used = trick ? (others.length ? 'also ' + others.map(esc).join(', ') : '') : (usedBy[k] || []).map(esc).join(', ') || 'no trick reads it';
    return `<div class="prm ${mine ? 'over' : ''}" data-p="${esc(k)}"><span><span class="nm">${esc(k)}</span><span class="used">${used}</span></span>` +
      `<input type="number" step="any" value="${esc(num(p.value))}" data-val>` +
      `<span class="def" title="the shipped default">${p.default === null || p.default === undefined || p.default === p.value ? '' : 'shipped ' + esc(num(p.default))}</span>` +
      `<span class="act">${p.source === 'shipped' || /tricks\.toml$/.test(p.source) ? '' : srcBadge(p.source)}${mine ? '<button class="small" data-reset title="remove the override">↺</button>' : ''}</span></div>`;
  }).join('') || '<p class="hint">no such parameter</p>';
}
function wireParams(box, scopeCraft) {
  box.querySelectorAll('.prm').forEach(row => {
    const inp = row.querySelector('[data-val]');
    inp.onchange = () => { const v = inp.value.trim(); if (v === '') return; setParam(row.dataset.p, +v, scopeCraft); };
    const r = row.querySelector('[data-reset]'); if (r) r.onclick = () => setParam(row.dataset.p, null, scopeCraft);
  });
}
function usedByMap() { const m = {}; for (const t of D.tricks) for (const p of t.params) (m[p] ||= []).push(t.id); return m; }
function skillRadios(name, current, inherit) {
  // a quad's preset goes over the all-quads one, never under it: a quad has no way back to the bare defaults
  const opts = inherit ? [['inherit', 'as all quads'], ...SKILLS.filter(s => s !== 'none').map(s => [s, s])] : SKILLS.map(s => [s, s === 'none' ? 'the defaults' : s]);
  return '<span class="segs">' + opts.map(([v, l]) => `<label class="seg"><input type="radio" name="${name}" value="${v}" ${(current || (inherit ? 'inherit' : 'none')) === v ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('') + '</span>';
}
function skillHint(cur) {
  // what the choice on screen does, said with the shipped presets' own flip threshold as the example
  const sk = (D.skills || {})[cur], roll = (v, d) => v !== undefined && d !== undefined && v !== d ? ` (a roll from ${num(v)}° instead of ${num(d)}°)` : '';
  const how = {beginner: 'a trick counts when it is nearly there', advanced: 'a trick counts only when it is clean'};
  if (cur === 'inherit') return `${esc(craft)} uses the skill chosen for all quads: ${L.skill ? esc(L.skill) : 'none, the shipped defaults'}.`;
  if (!sk) return `The shipped parameters, in between: ${how.beginner} with beginner, ${how.advanced.replace('a trick ', '')} with advanced.`;
  const n = Object.keys(sk).length;
  return `${how[cur] ? how[cur][0].toUpperCase() + how[cur].slice(1) : esc(cur)}${roll(sk.flip_min_deg, D.params.flip_min_deg?.default)}: it sets ${n} parameter${n > 1 ? 's' : ''} at once. ` +
    (craft ? `For ${esc(craft)} it goes over the all-quads skill and overrides; ${esc(craft)}'s own overrides still win.` : 'Your overrides still win over it.');
}
function craftNames() {                               // the declared spelling first, then what the logs say, one per quad
  const names = [];
  for (const c of [...Object.keys(D.crafts).filter(c => c !== 'default'), ...D.crafts_seen]) if (!names.some(n => sameCraft(n, c))) names.push(c);
  return names.sort((a, b) => a.localeCompare(b));
}
const PROPS = ['skill', 'params', 'segment', 'trick', 'source'];
const unsetTrick = (id, c) => edit(t => { const s = section(t, c); const e = (s.trick || []).find(x => x.id === id); if (!e) return; delete e.enabled; if (Object.keys(e).length === 1) s.trick = s.trick.filter(x => x !== e); });
const overrides = own => (own.skill ? 1 : 0) + Object.keys(own).filter(k => !PROPS.includes(k)).length + Object.keys(own.params || {}).length + (own.trick || []).filter(e => e.enabled !== undefined).length;
function mineBox(own, lib) {

async function runJob(args, out) {
  out.textContent = 'running…';
  const {job, error} = await api('/api/cli', {method: 'POST', body: JSON.stringify({args, async: true})});
  if (error) { out.textContent = error; return null; }
  for (;;) {
    await new Promise(r => setTimeout(r, 500));
    const r = await api('/api/cli/' + job);
    if (r.error) { out.textContent = r.error; return null; }
    if (r.done) {
      if (r.code !== 0 && !r.stdout.trim()) { out.textContent = (r.stderr || 'failed').trim().split('\n').pop(); return null; }
      try { return JSON.parse(r.stdout); } catch { out.textContent = 'unreadable result'; return null; }
    }
    out.textContent = `running… ${Math.round(r.seconds || 0)} s`;
  }
}
async function runCheck() {
  const res = await runJob(['tricks', 'check', '--json'], $('#checkOut'));
  if (!res) return;
  $('#checkOut').innerHTML = `<span class="${res.failed ? 'bad' : 'ok'}">${res.passed} passed, ${res.failed} failed</span>, ${res.unchecked} unchecked (log not on the server)`;
  $('#checkList').innerHTML = res.results.map(r => `<div class="m"><span class="${r.status === 'ok' ? 'ok' : r.status === 'FAILED' ? 'bad' : 'dim'}">${esc(r.status)}</span> ${esc(r.trick)} · ${esc(r.log.replace(/^BTFL_BLACKBOX_LOG_/, '').replace(/\.bbl$/, ''))} arm ${r.arm} ${esc(r.where)}${r.found ? ` → ${esc(r.found)}` : ''}${r.note ? ` <span class="dim">(${esc(r.note)})</span>` : ''}</div>`).join('');
}
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); return m + ':' + (t - m * 60).toFixed(1).padStart(4, '0'); };
async function runEval() {
  const s = $('#evalSession').value;
  const res = await runJob(['tricks', 'eval', s, '--json'], $('#evalOut'));
  if (!res) return;

  $('#evalOut').textContent = rows.length ? '' : 'no tagged tricks on matched clips in this session';
  $('#evalList').innerHTML = (rows.length ? `<table class="ev"><tr><th>tag</th><th>found</th><th>missed</th></tr>` + rows.map(([tag, c]) => `<tr><td>${pill(tag)}</td><td class="ok">${c.found}</td><td class="${c.missed ? 'bad' : ''}">${c.missed}</td></tr>`).join('') + `</table>` : '') +
    (res.missed.length ? `<h2>missed</h2><div class="list">` + res.missed.map(m => `<div class="m"><span class="t">${esc(m.video.slice(-7, -4))} ${fmt(m.start)}–${fmt(m.end)}</span>${pill(m.tag)} ${esc(m.title)} <span class="dim">arms ${Object.entries(m.arms).map(([a, t]) => `${a} @ ${t}`).join(', ')}</span></div>`).join('') + `</div>` : '') +
    (res.untagged.length ? `<h2>detections on no tagged moment (${res.untagged.length})</h2><div class="list">` + res.untagged.map(e => `<div class="m"><span class="t">${esc(e.video.slice(-7, -4))} ${fmt(e.start)}–${fmt(e.end)}</span>${pill(e.tag)} ${esc(e.title)} <span class="dim">arm ${e.arm} @ ${e.arm_from}${e.moment ? ` · in: ${esc(e.moment)}` : ''}</span></div>`).join('') + `</div>` : '');

    `<div class="row"><label><input type="checkbox" id="shAll"> show expired and revoked</label><span id="shBase" class="dim"></span></div><div id="shList"></div>`;

      `<span class="act"><a class="btn" data-moment href="${esc(x.moment ? `/?${new URLSearchParams({session: x.session, clip: x.clip, m: x.moment, share: 1})}` : `/?${new URLSearchParams({session: x.session, clip: x.clip, t: x.start})}`)}" title="the moment in the player, with its share panel">${x.moment ? 'moment' : 'clip'}</a>` +
      `${x.state === 'active' && x.url ? `<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">open</a><button class="small" data-copy="${esc(x.url)}">copy</button>` : ''}` +

    $('#shList').querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); status('link copied'); } catch { prompt('link', b.dataset.copy); } });

// in a child (POST /api/osd/probe: probe, fit, fonts) and keeps the profiles as one document (/api/osd/doc).
let OSD = null, ODOC = {doc: {}, etag: null}, OE = null, OSESS = null, oSeq = 0;
const ofmt = v => v === null || v === undefined ? '–' : (() => { const m = Math.floor(v / 60), s = v - m * 60; return `${m}:${(Number.isInteger(s) ? String(s).padStart(2, '0') : s.toFixed(1).padStart(4, '0'))}`; })();
async function loadOsd() {
  // a failed answer is said and nothing is kept: the next visit asks again (OSD stays null)
  const [osd, doc] = await Promise.all([api('/api/osd'), api('/api/osd/doc')]);
  const sess = OSESS ? null : await api('/api/sessions');
  const failed = [osd, doc, sess].find(x => x && x.error);
  if (failed) { err(failed.error); return false; }
  [OSD, ODOC] = [osd, doc];
  if (!OSESS) OSESS = sess.filter(s => s.videos).map(s => s.session).sort().reverse();
  return true;
}
function osdNew() {
  OE = {name: '', profile: null, layout: null, glyphs: null, mcm: null, session: OE?.session || OSESS[0] || null, video: OE?.video || null, t: OE?.t ?? 30, probe: null, rank: null};
}
async function osdOpen(name) {
  const p = ODOC.doc.profiles?.[name];
  OE = {...(OE || {}), name, profile: p, layout: null, glyphs: null, mcm: null, probe: null, rank: null};
  await osdDerive({profile: p});
}
async function osdDerive(body) {
  err('');
  const r = await api('/api/osd/derive', {method: 'POST', body: JSON.stringify({name: OE.name || 'profile', ...body})});
  if (r.error) { err(r.error); return false; }
  Object.assign(OE, {profile: r.profile, layout: r.layout, glyphs: r.glyphs, probe: null});
  const rd = $('#oRead'); if (rd) rd.textContent = 'reading the frame…';     // the old reading is not this profile's
  await renderOsd();
  await osdProbe();
  return true;
}
async function osdLook(op) {
  if (!OE?.profile || !OE.session || !OE.video) return null;
  return api('/api/osd/probe', {method: 'POST', body: JSON.stringify({op, profile: OE.profile, session: OE.session, video: OE.video, t: +OE.t})});
}
async function osdProbe() {
  const seq = ++oSeq;
  drawFrame();
  if (!OE?.profile || !OE.video) return;
  $('#oRead').textContent = 'reading the frame…';
  const r = await osdLook('probe');
  if (seq !== oSeq || !r) return;                     // a newer look started meanwhile
  if (r.error) { OE.probe = null; $('#oRead').innerHTML = `<span class="bad">${esc(r.error)}</span>`; drawOverlay(); return; }
  OE.probe = r;
  const v = r.values;
  $('#oRead').innerHTML = `arm <b data-v="arm">${esc(ofmt(v.arm))}</b> · total <b data-v="total">${esc(ofmt(v.total))}</b>` +
    (OE.layout?.counter ? ` · flight <b data-v="counter">${r.counter === null ? '–' : '#' + r.counter}</b>` : '') +
    (r.stats ? ` · STATS total arm <b data-v="stats_total">${esc(ofmt(r.stats.total_arm))}</b>, blackbox <b>${r.stats.blackbox ?? '–'} %</b>` : '') +
    `<span class="dim">${r.cells.filter(c => c.digit).length} digits read, weakest ${Math.min(...r.cells.filter(c => c.digit).map(c => c.score), 1).toFixed(2)}</span>`;
  drawOverlay();
}
function drawFrame() {
  const img = $('#oImg');
  if (!img) return;
  const f = OE?.session && OE.video ? `/frame/${encodeURIComponent(OE.session)}/${encodeURIComponent(OE.video)}/${(+OE.t).toFixed(2)}` : '';
  if (img.dataset.src !== f) { img.dataset.src = f; if (f) img.src = f; else img.removeAttribute('src'); }
  $('#oMsg').style.display = f ? 'none' : 'flex';
  drawOverlay();
}
function drawOverlay() {
  const cv = $('#oCanvas');
  if (!cv) return;
  const L = OE?.layout, g = L?.grid;
  const [W, H] = L?.frame || [720, 480];
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, W, H);
  if (!g) return;
  c.strokeStyle = 'rgba(76,194,255,.22)'; c.lineWidth = 1;              // Betaflight's grid, where the profile puts it
  const rows = L.stats_scan ? L.stats_scan.rows.length : 13;
  for (let k = 0; k <= 30; k++) { c.beginPath(); c.moveTo(g.x + k * g.cw + .5, g.y); c.lineTo(g.x + k * g.cw + .5, g.y + rows * g.ch); c.stroke(); }
  for (let k = 0; k <= rows; k++) { c.beginPath(); c.moveTo(g.x, g.y + k * g.ch + .5); c.lineTo(g.x + 30 * g.cw, g.y + k * g.ch + .5); c.stroke(); }
  const [gx, gw, gy, gh] = L.glyph;
  const col = s => s >= .7 ? '#5fd68b' : s >= .5 ? '#f5a524' : '#ff6b6b';
  c.font = 'bold 15px ui-monospace, monospace'; c.textAlign = 'center';
  const cells = OE.probe?.cells || L.formats.flatMap((f, row) => [...f].map((ch, k) => ({kind: 'timer', row, k, x: L.x0[row] + k * L.pitch, y: L.rows[row], fmt: ch})));
  for (const cell of cells) {
    if (cell.kind === 'stats') { c.strokeStyle = '#4cc2ff'; c.lineWidth = 2; c.strokeRect(cell.x + .5, cell.y + .5, cell.w, g.ch); continue; }
    if (cell.fmt !== 'd') continue;
    const s = cell.digit ? cell.score : 0;
    c.strokeStyle = OE.probe ? col(s) : '#9aa3b2'; c.lineWidth = 2;
    c.strokeRect(cell.x + gx + .5, cell.y + gy + .5, gw, gh);
    if (OE.probe) {
      // the read digit above the first timer row and the counter's, below the others: two rows' labels never meet
      const above = cell.kind === 'timer' && cell.row === 0 && L.formats.length > 1;
      c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(cell.x + gx, above ? cell.y + gy - 18 : cell.y + gy + gh + 2, gw, 16);
      c.fillStyle = col(s); c.fillText(cell.digit ?? '?', cell.x + gx + gw / 2, above ? cell.y + gy - 5 : cell.y + gy + gh + 15);
    }
  }
}
function drawGlyphs() {
  const cv = $('#oGlyphsCanvas');
  if (!cv || !OE?.glyphs) return;
  const chars = Object.keys(OE.glyphs), z = 3;
  cv.width = chars.length * 13 * z; cv.height = 18 * z;
  const c = cv.getContext('2d');
  chars.forEach((ch, i) => OE.glyphs[ch].forEach((row, y) => [...row].forEach((p, x) => {
    if (p === '.') return;
    c.fillStyle = p === 'w' ? '#fff' : '#000'; c.fillRect((i * 13 + x) * z, y * z, z, z);
  })));
}
async function osdClips() {
  if (!OE.session) return [];
  const s = await api('/api/session/' + encodeURIComponent(OE.session));
  return (s.videos || []).map(v => ({file: v.file, name: v.name || v.file, duration: v.duration}));
}
async function renderOsd() {
  const box = $('#osdPanel');
  if (!OSD) { box.innerHTML = '<p class="hint">loading…</p>'; if (!await loadOsd()) { box.innerHTML = '<p class="hint">the OSD profiles could not be loaded: open the tab again to retry</p>'; return; } }
  if (!OE) osdNew();
  const names = Object.keys(ODOC.doc.profiles || {});
  const clips = await osdClips();
  if (OE.session && (!OE.video || !clips.some(c => c.file === OE.video))) OE.video = clips[0]?.file || null;
  const L = OE.layout, p = OE.profile, g = p?.grid || OSD.grid.NTSC;
  const t = L?.derived?.timers || [];
  box.innerHTML = `<h2>OSD profiles</h2><p class="hint">How the timers are read off your DVR footage, from what Betaflight says: the CLI's <code>diff all</code> (where the timers are and what they count), the font on the OSD chip, and where your goggles put Betaflight's grid in the picture. Yours are tried next to the ones that ship with acroscope (${OSD.builtin.map(esc).join(', ')}: the OSDs flown on Rudi's quads); a clip takes whichever reads it best.</p>` +
    `<div class="row" id="oProfiles">${names.map(n => `<span class="chip ${n === OE.name && p ? 'on' : ''}" data-oname="${esc(n)}">${esc(n)}</span>`).join('')}` +
    Object.entries(OSD.errors).map(([n, e]) => `<span class="chip bad" data-obroken="${esc(n)}" title="does not derive: ${esc(e)} (click to delete it)">${esc(n)} ⚠</span>`).join('') +
    `<span class="chip ${!names.includes(OE.name) ? 'on' : ''}" id="oNew">＋ new</span></div>` +
    `<div class="kv osd-kv" style="margin-top:10px">` +
    `<b>name</b><span class="row" style="margin:0"><input id="oName" value="${esc(OE.name)}" placeholder="e.g. otto-impact" style="width:180px"><span class="dim">lower case, digits, . _ -</span></span>` +
    `<b>dump</b><span>${p ? `<span class="dim" id="oDumpSum">${esc(L?.derived?.version || 'firmware not named')}${L?.derived?.craft ? ' · ' + esc(L.derived.craft) : ''} · ${t.map(x => `timer ${x.n}: ${esc(x.source)} ${esc(x.format)} at column ${x.col}, row ${x.row}`).join(' · ') || 'no timer'}${L?.counter ? ' · flight counter' : ''}</span> <button class="small" id="oDumpAgain">paste another</button>` : ''}` +
    `<textarea id="oDump" placeholder="paste the output of diff all from the Betaflight CLI (only the OSD settings are kept)" style="min-height:90px;${p ? 'display:none' : ''}"></textarea>` +
    `<span class="row" style="${p ? 'display:none' : ''}" id="oDumpRow"><input type="file" id="oDumpFile" accept=".txt,text/plain" style="font-size:12px"></span></span>` +
    `<b>font</b><span class="row" style="margin:0"><select id="oFont">${OSD.fonts.map(f => `<option ${f === (p?.font?.name ?? 'default') ? 'selected' : ''}>${esc(f)}</option>`).join('')}` +
      `<option value="" ${p && !OSD.fonts.includes(p.font?.name) ? 'selected' : ''}>${p && !OSD.fonts.includes(p.font?.name) ? esc(p.font?.name) + ' (yours)' : 'your own .mcm…'}</option></select>` +
      `<input type="file" id="oMcm" accept=".mcm" style="display:none"><button class="small" id="oRankBtn" ${p && OE.video ? '' : 'disabled'}>which font fits this frame?</button></span>` +
    `<b>grid</b><span class="row" style="margin:0">x <input type="number" id="oX" value="${g.x}"> y <input type="number" id="oY" value="${g.y}"> cell <input type="number" id="oCw" value="${g.cw}"> × <input type="number" id="oCh" value="${g.ch}">` +
      `<button class="small" id="oFit" ${p && OE.video ? '' : 'disabled'}>fit to this frame</button></span>` +
    `<b>frame</b><span class="row" style="margin:0"><select id="oSession">${OSESS.map(s => `<option ${s === OE.session ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>` +
      `<select id="oClip">${clips.map(c => `<option value="${esc(c.file)}" ${c.file === OE.video ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` +
      ` at <input type="number" id="oT" step="0.5" min="0" value="${OE.t}"> s <button class="small" data-dt="-1">−1 s</button><button class="small" data-dt="1">+1 s</button><button class="small" data-dt="10">+10 s</button></span>` +
    `</div><div id="oWarn">${(L?.warnings || []).map(w => `<div>${esc(w)}</div>`).join('')}</div>` +
    `<div class="osdview"><img id="oImg" alt=""><canvas id="oCanvas"></canvas><div class="msg" id="oMsg">no clip to look at: choose a session with clips</div></div>` +
    `<div id="oRead" class="dim">${p ? '' : 'paste a dump to see what it reads'}</div>` +
    `<div class="row" id="oGlyphs">${OE.glyphs ? `<canvas id="oGlyphsCanvas"></canvas><span class="dim">the font's characters as the profile has them</span>` : ''}</div>` +
    `<div id="oRank"></div>` +
    `<div class="row"><button class="primary" id="oSave" ${p ? '' : 'disabled'}>save</button>${names.includes(OE.name) ? '<button id="oDelete">delete</button>' : ''}<span id="oSaved" class="dim"></span></div>`;
  box.querySelectorAll('[data-oname]').forEach(el => el.onclick = () => osdOpen(el.dataset.oname));
  // a stored profile that no longer derives cannot be opened: its chip deletes it (the others are kept as they are)
  box.querySelectorAll('[data-obroken]').forEach(el => el.onclick = async () => {
    const n = el.dataset.obroken;
    if (!confirm(`The OSD profile ${n} no longer derives:\n${OSD.errors[n]}\n\nDelete it?`)) return;
    const doc = clone(ODOC.doc); delete doc.profiles[n];
    const r = await api('/api/osd/doc?etag=' + encodeURIComponent(ODOC.etag || ''), {method: 'POST', body: JSON.stringify(doc)});
    if (r.error) { err(r.error); if (/changed since/.test(r.error)) { await loadOsd(); await renderOsd(); } return; }
    err(''); await loadOsd(); await renderOsd();
  });
  $('#oNew').onclick = () => { osdNew(); renderOsd(); };
  $('#oName').oninput = e => { OE.name = e.target.value.trim(); };
  const font = () => { const f = $('#oFont').value; return f ? {font: f} : OE.mcm ? {font: OE.mcmName, mcm: OE.mcm} : null; };
  const fromDump = async text => { if (!text.trim()) return; const f = font(); if (!f) { err('choose a font, or load the .mcm of your own'); return; } await osdDerive({dump: text, ...f, grid: OE.profile?.grid}); };
  let deb;
  $('#oDump').oninput = e => { clearTimeout(deb); deb = setTimeout(() => fromDump(e.target.value), 500); };
  $('#oDumpFile').onchange = async e => { const f = e.target.files[0]; if (f) await fromDump(await f.text()); };
  if ($('#oDumpAgain')) $('#oDumpAgain').onclick = () => { $('#oDump').style.display = ''; $('#oDumpRow').style.display = ''; $('#oDumpAgain').remove(); $('#oDump').focus(); };
  $('#oFont').onchange = async e => {
    if (!e.target.value) { $('#oMcm').click(); return; }
    if (OE.profile) await osdDerive({profile: OE.profile, font: e.target.value});
  };
  $('#oMcm').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    OE.mcm = await f.text(); OE.mcmName = f.name.replace(/\.mcm$/i, '').toLowerCase().replace(/[^a-z0-9._-]+/g, '-');
    if (OE.profile) await osdDerive({profile: OE.profile, font: OE.mcmName, mcm: OE.mcm});
    else if ($('#oDump').value.trim()) await fromDump($('#oDump').value);
  };
  const grid = () => ({x: +$('#oX').value, y: +$('#oY').value, cw: +$('#oCw').value, ch: +$('#oCh').value});
  ['#oX', '#oY', '#oCw', '#oCh'].forEach(id => $(id).onchange = () => OE.profile && osdDerive({profile: OE.profile, grid: grid()}));
  $('#oSession').onchange = async e => { OE.session = e.target.value; OE.video = null; OE.probe = null; await renderOsd(); osdProbe(); };
  $('#oClip').onchange = e => { OE.video = e.target.value; osdProbe(); };
  $('#oT').onchange = e => { OE.t = Math.max(0, +e.target.value || 0); osdProbe(); };
  box.querySelectorAll('[data-dt]').forEach(b => b.onclick = () => { OE.t = Math.max(0, +OE.t + +b.dataset.dt); $('#oT').value = OE.t; osdProbe(); });
  $('#oFit').onclick = async () => {
    $('#oFit').disabled = true; status('fitting the grid to this frame…');
    const r = await osdLook('fit');
    status('');
    if (!r || r.error) { err(r?.error || 'no frame'); $('#oFit').disabled = false; return; }
    await osdDerive({profile: OE.profile, grid: {...OE.profile.grid, x: r.x, y: r.y}});
    $('#oSaved').textContent = `grid fitted: x ${r.x}, y ${r.y} (score ${r.was.score} → ${r.score})`;
  };
  $('#oRankBtn').onclick = async () => {
    $('#oRankBtn').disabled = true; $('#oRank').innerHTML = '<p class="hint">reading this frame with every Configurator font…</p>';
    const r = await osdLook('fonts');
    $('#oRankBtn').disabled = false;
    if (!r || r.error) { $('#oRank').innerHTML = ''; err(r?.error || 'no frame'); return; }
    $('#oRank').innerHTML = `<h2>fonts on this frame</h2>` + r.fonts.map(f => `<div class="r" data-font="${esc(f.font)}"><b>${esc(f.font)}</b><span>${f.score ?? '–'}</span><span class="dim">${f.error ? esc(f.error) : `arm ${esc(ofmt(f.values?.arm))}, total ${esc(ofmt(f.values?.total))}`}</span></div>`).join('');
    $('#oRank').querySelectorAll('[data-font]').forEach(el => el.onclick = async () => { await osdDerive({profile: OE.profile, font: el.dataset.font}); });
  };
  $('#oSave').onclick = async () => {
    err('');
    if (!OE.name) { err('name the profile first'); $('#oName').focus(); return; }
    const doc = clone(ODOC.doc); doc.version ??= 1; (doc.profiles ||= {})[OE.name] = OE.profile;
    $('#oSave').disabled = true;                      // one save at a time: a second click would carry the same etag and be refused
    const r = await api('/api/osd/doc?etag=' + encodeURIComponent(ODOC.etag || ''), {method: 'POST', body: JSON.stringify(doc)});
    if (r.error) { err(r.error); $('#oSave').disabled = false; if (/changed since/.test(r.error)) { await loadOsd(); renderOsd(); } return; }
    await loadOsd(); await renderOsd(); $('#oSaved').textContent = `saved: the reader tries ${OE.name} on every clip it reads from now on`;
  };
  if ($('#oDelete')) $('#oDelete').onclick = async () => {
    if (!confirm(`Delete the OSD profile ${OE.name}? Clips read with it are read again with what is left.`)) return;
    const doc = clone(ODOC.doc); delete doc.profiles[OE.name];
    $('#oDelete').disabled = true;
    const r = await api('/api/osd/doc?etag=' + encodeURIComponent(ODOC.etag || ''), {method: 'POST', body: JSON.stringify(doc)});
    if (r.error) { err(r.error); $('#oDelete').disabled = false; return; }
    osdNew(); await loadOsd(); await renderOsd();
  };
  $('#oImg').onload = drawOverlay;
  drawGlyphs();
  drawFrame();
  renders++;
}

// ---- devices (#75): what may upload through the drop. A token per device, said once: when it is paired
let paired = null;                                    // the device just paired, with its token: gone when the page loads again
let dropUrl = null;                                   // where devices reach the drop, when the server names a host of its own for it
function renderDevices() {
  const box = $('#devicesPanel');
  box.innerHTML = `<h2>devices</h2><p class="hint">a phone with the companion app uploads what it collected through this server. Each device has a token of its own, shown once, when it is paired. Revoking a device stops its token and drops what it had staged; what it already handed in stays.</p>` +
    `<div class="row"><input id="dvName" placeholder="a name for the device" maxlength="60"><button class="primary" id="dvAdd">pair a device</button><span id="dvAt" class="dim"></span></div><div id="dvCode"></div><div id="dvList"></div>`;
  const day = x => x ? esc(new Date(x).toLocaleDateString()) : '';
  const code = () => {
    if (!paired) { $('#dvCode').innerHTML = ''; return; }
    const link = `acroscope://pair?${new URLSearchParams({url: dropUrl || location.origin, token: paired.token})}`;
    $('#dvCode').innerHTML = `<div class="pair"><b>${esc(paired.name)}</b> is paired. Its code is shown this once: open it on the phone, or paste it into the app.` +
      `<div class="row"><input id="dvLink" readonly value="${esc(link)}"><button class="small" id="dvCopy">copy</button><a class="btn" id="dvOpen" href="${esc(link)}">open in the app</a></div></div>`;
    $('#dvCopy').onclick = async () => { try { await navigator.clipboard.writeText(link); status('code copied'); } catch { $('#dvLink').select(); } };
  };
  const load = async () => {
    const r = await api('/api/devices');
    if (r.error) { err(r.error); return; }
    dropUrl = r.url || null;
    $('#dvAt').textContent = `devices upload at ${(dropUrl || location.origin).replace(/^https?:\/\//, '')}`;
    code();
    $('#dvList').innerHTML = (r.devices || []).slice().reverse().map(d => `<div class="shrow" data-device="${esc(d.id)}"><span class="st ${d.revoked_at ? 'revoked' : 'active'}">${d.revoked_at ? 'revoked' : 'paired'}</span>` +
      `<span class="what"><b>${esc(d.name)}</b><span class="dim">since ${day(d.created_at)} · ${d.revoked_at ? 'revoked ' + day(d.revoked_at) : d.last_seen_at ? 'last seen ' + day(d.last_seen_at) : 'not seen yet'}</span></span>` +
      `<span class="act">${d.revoked_at ? '' : `<button class="small" data-revoke="${esc(d.id)}">revoke</button>`}</span></div>`).join('') || '<p class="hint">no device paired</p>';
    $('#dvList').querySelectorAll('[data-revoke]').forEach(b => b.onclick = async () => {
      if (!confirm('Revoke this device? Its token stops working and what it has staged is dropped.')) return;
      const d = await api('/api/devices/' + encodeURIComponent(b.dataset.revoke), {method: 'DELETE'});
      if (d.error) { err(d.error); return; }
      if (paired && paired.id === b.dataset.revoke) paired = null;
      code();
      await load();
    });
    renders++;
  };
  $('#dvAdd').onclick = async () => {
    err('');
    const d = await api('/api/devices', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: $('#dvName').value})});
    if (d.error) { err(d.error); return; }
    paired = d;
    $('#dvName').value = '';
    code();
    await load();
  };
  code();
  load();
}

// ---- tabs
let renders = 0;                                      // counts the redraws, for the tests to wait on
const TABS = ['tags', 'shares', 'detection', 'osd', 'devices'];
function render() {
  if (!D) return;
  renders++;
  status(`${D.tricks.filter(t => t.enabled).length}/${D.tricks.length} tricks on · ${D.skill ? 'skill ' + D.skill : 'default parameters'}`);
  ({tags: renderTags, shares: renderShares, detection: renderDetection, osd: renderOsd, devices: renderDevices})[tab]();
}
function show(t) {
  tab = t;
  document.querySelectorAll('#tabs span').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  document.querySelectorAll('section[data-panel]').forEach(s => s.classList.toggle('on', s.dataset.panel === t));
  try { localStorage.setItem('acro.cfgtab', t); } catch {}
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  render();
}
document.querySelectorAll('#tabs span').forEach(x => x.onclick = () => show(x.dataset.tab));
const phoneQuery = matchMedia('(max-width: 1000px)');
const setPhone = () => document.body.classList.toggle('phone', phoneQuery.matches);
phoneQuery.addEventListener('change', setPhone);
setPhone();
(async () => {
  status('loading…');
  // the tabs that went into detection keep their links (#profile, #drones, #tricks, #settings) and a remembered tab
  const known = t => ({profile: 'detection', drones: 'detection', tricks: 'detection', settings: 'detection'})[t] || (TABS.includes(t) ? t : null);
  tab = known(location.hash.slice(1)) || known((() => { try { return localStorage.getItem('acro.cfgtab'); } catch { return null; } })()) || 'tags';
  const sessions = await api('/api/sessions');
  SESS = sessions.error ? [] : sessions.filter(s => s.moments).map(s => ({session: s.session, moments: s.moments}));
  await load();
  show(tab);
})();
</script>
